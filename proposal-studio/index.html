<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proposal Studio · 퍼포먼스 마케팅 제안서 AI 작성 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{--bg:#F4F5F8;--card:#fff;--line:#E4E7EC;--ink:#101828;--sub:#475467;--mute:#98A2B3;--pri:#3D5AFE;--pri2:#EEF1FF;--ok:#12B76A;--warn:#F79009;--bad:#F04438}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:13px}
header.top{position:sticky;top:0;z-index:50;background:#0B1020;color:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;height:60px}
header.top .logo{font-weight:800;letter-spacing:-.3px;font-size:17px;white-space:nowrap}
header.top .logo small{font-weight:300;color:#A5B4FC;margin-left:6px;font-size:12px}
nav.steps{display:flex;gap:4px;flex:1;justify-content:center}
nav.steps button{background:transparent;border:0;color:#C7CBD6;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
nav.steps button b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:#2A3149;margin-right:6px;font-size:11px;text-align:center}
nav.steps button.on{background:#1E2640;color:#fff}
nav.steps button.on b{background:var(--pri)}
.hbtns{display:flex;gap:6px}
.hbtns button{background:#1E2640;color:#E5E7EB;border:1px solid #2A3149;border-radius:8px;padding:7px 11px;cursor:pointer}
.keydot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--bad)}
.keydot.on{background:var(--ok)}
main{max-width:1320px;margin:0 auto;padding:24px 24px 120px}
h2.pt{font-size:22px;margin:4px 0 4px;letter-spacing:-.4px}
p.pd{color:var(--sub);margin:0 0 18px;font-weight:300}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--pri);color:#fff;border-radius:6px;font-size:11px;padding:2px 7px}
.card .hint{color:var(--mute);font-size:12px;font-weight:300;margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}nav.steps button span{display:none}}
label.f{display:block;font-size:12px;color:var(--sub);margin:0 0 4px;font-weight:600}
input[type=text],input[type=url],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mt12{margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#C9CED8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:#101828;color:#fff;border-color:#101828}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.bad{color:var(--bad)}
.btn.big{padding:14px 26px;font-size:15px;border-radius:12px}
.cta{display:flex;justify-content:center;gap:10px;margin:8px 0 20px;flex-wrap:wrap}
.drop{border:1.5px dashed #C9CED8;border-radius:12px;padding:22px;text-align:center;color:var(--sub);cursor:pointer;background:#FAFBFC;position:relative}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{display:block;color:var(--ink);margin-bottom:4px}
.files{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px}
.file .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta{color:var(--mute)}
.file img{width:34px;height:34px;object-fit:cover;border-radius:4px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#F2F4F7;color:var(--sub);font-weight:600}
.tag.ok{background:#ECFDF3;color:#027A48}.tag.warn{background:#FFFAEB;color:#B54708}.tag.bad{background:#FEF3F2;color:#B42318}.tag.pri{background:var(--pri2);color:var(--pri)}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chip .sw{height:80px;position:relative}
.chip .sw input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.chip .bd{padding:10px}
.chip .bd input{margin-bottom:6px}
table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv th{width:120px;text-align:left;color:var(--sub);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.kv td textarea{min-height:36px;border-color:transparent;padding:4px 6px}
table.kv td textarea:hover{border-color:var(--line)}
.prio{display:grid;grid-template-columns:36px 1fr 1fr 1fr 70px 92px;gap:8px;align-items:start;border-bottom:1px solid var(--line);padding:8px 0}
.prio.h{font-size:12px;color:var(--sub);font-weight:700;padding-top:0}
.prio .rk{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.prio textarea{min-height:52px;font-size:12px}
.busy{position:fixed;inset:0;background:rgba(11,16,32,.55);z-index:200;display:flex;align-items:center;justify-content:center}
.busy .bx{background:#fff;border-radius:14px;padding:26px 30px;min-width:340px;text-align:center}
.spin{width:34px;height:34px;border:4px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy .msg{font-weight:700}.busy .sub{color:var(--sub);font-size:12px;margin-top:6px;font-weight:300}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 18px;border-radius:10px;z-index:300;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw}
.modal{position:fixed;inset:0;background:rgba(11,16,32,.6);z-index:150;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.modal .mb{background:#fff;border-radius:16px;padding:22px;width:min(1180px,100%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal .mh h3{margin:0}
/* slides */
.sw-wrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--line);background:#fff;flex:none}
.sw-wrap .slide{transform-origin:0 0;position:absolute;left:0;top:0}
.slide{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Pretendard,sans-serif;background:#fff;background-size:cover;background-position:center}
.slide .t{position:absolute;display:flex;flex-direction:column;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;overflow:hidden;letter-spacing:-.02em}
.slide .r,.slide .im{position:absolute}
.slide .im{object-fit:contain}
/* logic */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:6px;overflow:hidden}
.sec.extra{border-style:dashed;border-color:#B8C2D9;background:#FBFCFF}
.sec-h{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec-h .no{font-weight:800;font-size:18px;color:var(--pri);width:34px}
.sec-h input.tt{flex:1;min-width:200px;font-weight:700;font-size:15px}
.sec-h .pc{width:64px}
.sec-h label.ck{font-size:12px;color:var(--sub);display:flex;gap:4px;align-items:center;white-space:nowrap}
.sec-g{padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFCFD}
.pages{padding:14px;display:flex;flex-direction:column;gap:12px}
.pg{display:flex;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.pg .thumb{cursor:zoom-in}
.pg .pf{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pg .pf .row select{width:auto}
.items{display:flex;flex-direction:column;gap:4px}
.it{display:grid;grid-template-columns:24px 1.1fr 90px 2fr 26px;gap:4px;align-items:start}
.it .ix{font-size:11px;color:var(--mute);padding-top:9px;text-align:center}
.it textarea{min-height:34px;padding:6px 8px;font-size:12px}
.it input{padding:6px 8px;font-size:12px}
.ins{display:flex;justify-content:center;margin:4px 0 10px}
.ins .btn{border-radius:20px;border-style:dashed;color:var(--pri);background:transparent}
.kind{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--pri2);color:var(--pri)}
.kind.company{background:#FDF2FA;color:#C11574}.kind.brand{background:#ECFDF3;color:#027A48}.kind.case{background:#FFF6ED;color:#C4320A}
.gallery{display:flex;flex-wrap:wrap;gap:12px}
.gi{position:relative}
.gi .lb{font-size:11px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.bar{height:8px;background:#F2F4F7;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
table.list{width:100%;border-collapse:collapse;font-size:13px}
table.list th{background:#F9FAFB;text-align:left;padding:8px;border-bottom:1px solid var(--line);color:var(--sub);font-size:12px}
table.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
del{color:var(--bad)}ins{color:#027A48;text-decoration:none;font-weight:700}
.note{background:#FFFAEB;border:1px solid #FEDF89;color:#93370D;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6}
.note.info{background:#EFF8FF;border-color:#B2DDFF;color:#175CD3}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:300px;overflow:auto;margin-top:8px}
.media .m{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:11px}
.media .m img{width:100%;height:70px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.story{display:grid;grid-template-columns:28px 1fr 2fr 26px;gap:6px;margin-bottom:6px;align-items:start}
.story .ix{font-weight:800;color:var(--pri);padding-top:8px}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Proposal Studio<small>AI 퍼포먼스 제안서</small></div>
  <nav class="steps" id="steps"></nav>
  <div class="hbtns">
    <button data-act="settings" title="AI·템플릿 설정"><span class="keydot" id="keydot"></span>설정</button>
    <button data-act="saveJSON" title="프로젝트 파일 저장">저장</button>
    <button data-act="loadJSON" title="프로젝트 파일 불러오기">열기</button>
    <button data-act="newProject" title="새 프로젝트">새로</button>
  </div>
</header>
<main id="app"></main>
<div id="layer"></div>
<input type="file" id="jsonIn" accept=".json" hidden>
<div id="offscreen" style="position:fixed;left:-30000px;top:0"></div>

<script>
/* =========================================================
   Proposal Studio — 단일 파일 웹앱
   데이터: 브라우저 localStorage에만 저장 (서버 전송 없음, AI 호출 시 Anthropic API로만 전송)
   ========================================================= */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return `${d.getFullYear()}.${two(d.getMonth()+1)}.${two(d.getDate())}`; };
const RAW = {}; // 원본 바이너리(PDF base64 등) — 메모리에만

const STEPS = [['input','인풋'],['logic','로직'],['wash','디자인 워싱'],['check','점검·취합']];
const PAGE_TYPES = {divider:'간지형', bridge:'브릿지형', strategy:'전략형', explain:'설명형'};
const LAYOUTS = {list:'리스트', cards:'카드', process:'프로세스', kpi:'KPI 수치', split:'좌우 분할', table:'표', image:'이미지'};
const KINDS = {strategy:'전략', company:'회사소개', brand:'브랜드 스터디', case:'케이스 스터디'};
const URL_TYPES = ['자사몰','네이버 스마트스토어','네이버 브랜드스토어','쿠팡','카카오 선물하기','인스타그램','유튜브','기타'];
const MODELS = [['claude-sonnet-5-5','Claude Sonnet 5.5 (권장·균형)'],['claude-opus-5-5','Claude Opus 5.5 (최고 품질)'],['claude-haiku-5-5','Claude Haiku 5.5 (빠름·저비용)']];

function defaultState(){
  return {
    v: 1, step: 'input',
    project: {name: '', client: '', proposer: 'MADUP (매드업)', date: today()},
    settings: {model: 'claude-sonnet-5-5', web: true},
    input: {
      rfp: [], urls: [{type: '자사몰', url: ''}], product: '', brand: [], notes: '',
      analysis: null,
      colors: [{hex:'#1F3A93',role:'Main',name:'Deep Navy',reason:''},{hex:'#4C8BF5',role:'Sub',name:'Sky Blue',reason:''},{hex:'#FFB020',role:'Accent',name:'Amber',reason:''}],
      colorConcept: ''
    },
    template: {logo: null, logoW: 0, logoH: 0, logoPos: 'tr', coverBg: null, footer: 'MADUP'},
    sections: [],
    checks: {typos: null, fit: null},
    merge: {cover: true, guide: true, toc: true, closing: true, done: false}
  };
}
let S = load() || defaultState();
let MEDIA = []; // 템플릿에서 추출한 이미지 (메모리)

function load(){ try { const s = JSON.parse(localStorage.getItem('ps_state') || 'null'); if (s && s.v) return Object.assign(defaultState(), s); } catch(e){} return null; }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => {
  try { localStorage.setItem('ps_state', JSON.stringify(S)); }
  catch(e){ toast('브라우저 저장 용량 초과 — 상단 [저장]으로 프로젝트 파일을 내려받아 두세요'); }
}, 500); }
const apiKey = () => localStorage.getItem('ps_key') || '';

function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }

/* ---------------- UI helpers ---------------- */
function toast(m, ms = 2600){ $$('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function busy(msg, sub = ''){ let b = $('#busy'); if (!b){ b = document.createElement('div'); b.id = 'busy'; b.className = 'busy'; b.innerHTML = '<div class="bx"><div class="spin"></div><div class="msg"></div><div class="sub"></div></div>'; document.body.appendChild(b); } $('.msg', b).textContent = msg; $('.sub', b).textContent = sub; }
function unbusy(){ $('#busy')?.remove(); }
function modal(title, html, wide = true){ const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="mb" style="${wide ? '' : 'width:min(640px,100%)'}"><div class="mh"><h3>${title}</h3><button class="btn" data-close>닫기</button></div><div class="mc">${html}</div></div>`; m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }); $('#layer').appendChild(m); return m; }
async function pool(arr, n, fn){ const out = []; let i = 0; const run = async () => { while (i < arr.length){ const k = i++; out[k] = await fn(arr[k], k); } }; await Promise.all(Array.from({length: Math.min(n, arr.length)}, run)); return out; }

/* ---------------- color utils ---------------- */
function hexRgb(h){ h = (h || '#000').replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b){ return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function mix(a, b, t){ const A = hexRgb(a), B = hexRgb(b); return rgbHex(...A.map((v, i) => v + (B[i] - v) * t)); }
function lum(h){ const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; }
const onC = c => lum(c) > .42 ? '#111111' : '#FFFFFF';
const validHex = h => /^#[0-9A-Fa-f]{6}$/.test(h || '');
function palette(washed){
  if (!washed) return {c1:'#3A3A3A', c2:'#6B6B6B', c3:'#8C8C8C', ink:'#3A3A3A', tint:'#F3F3F3', tint2:'#E9E9E9', draft:true};
  const cs = S.input.colors.map(c => validHex(c.hex) ? c.hex.toUpperCase() : '#333333');
  const c1 = cs[0], c2 = cs[1] || mix(c1, '#FFFFFF', .35), c3 = cs[2] || c2;
  const ink = lum(c1) > .35 ? mix(c1, '#000000', .45) : c1;
  return {c1, c2, c3, ink, tint: mix(c1, '#FFFFFF', .93), tint2: mix(c2, '#FFFFFF', .86)};
}

/* =========================================================
   SLIDE SPEC — HTML 미리보기와 PPT 추출이 같은 좌표계(1280×720px)를 공유
   ========================================================= */
const W = 1280, H = 720, MX = 60;
const R = (x, y, w, h, fill, o = {}) => ({k:'r', x, y, w, h, fill, ...o});
const T = (x, y, w, h, text, o = {}) => ({k:'t', x, y, w, h, text: String(text ?? ''), size: 16, color: '#111111', align: 'left', valign: 'top', lh: 1.35, ...o});
const IM = (x, y, w, h, data, o = {}) => ({k:'i', x, y, w, h, data, ...o});

function fitBox(nw, nh, x, y, w, h){ if (!nw || !nh) return {x, y, w, h}; const s = Math.min(w / nw, h / nh); const ww = nw * s, hh = nh * s; return {x: x + (w - ww) / 2, y: y + (h - hh) / 2, w: ww, h: hh}; }

function chrome(E, it, P, dark){
  const tp = S.template, fg = dark ? onC(dark) : '#111111';
  const subC = dark ? (fg === '#FFFFFF' ? '#FFFFFF' : '#333333') : '#98A2B3';
  // logo
  const lh = 28; let lw = 150, pos = tp.logoPos || 'tr';
  const lx = pos.includes('l') ? MX : W - MX - lw;
  const ly = pos.includes('t') ? 30 : H - 30 - lh;

function slideHTML(spec){
  const bg = spec.bgImg ? `background-color:${spec.bg};background-image:url(${spec.bgImg});` : `background:${spec.bg};`;
  let h = `<div class="slide" style="${bg}">`;
  for (const e of spec.els){
    const pos = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;${e.alpha != null ? `opacity:${e.alpha};` : ''}`;
    if (e.k === 'r') h += `<div class="r" style="${pos}background:${e.fill};${e.r ? `border-radius:${e.r}px;` : ''}${e.line ? `box-shadow:inset 0 0 0 1px ${e.line};` : ''}"></div>`;
    else if (e.k === 'i') h += `<img class="im" style="${pos}" src="${e.data}">`;
    else h += `<div class="t" style="${pos}font-size:${e.size}px;font-weight:${e.bold ? 700 : e.light ? 300 : 400};color:${e.color};text-align:${e.align};justify-content:${e.valign === 'middle' ? 'center' : e.valign === 'bottom' ? 'flex-end' : 'flex-start'};line-height:${e.lh};${e.ls != null ? `letter-spacing:${e.ls}px;` : ''}"><span>${esc(e.text)}</span></div>`;
  }
  return h + '</div>';
}
function thumbHTML(it, w = 320){ const s = w / W; return `<div class="sw-wrap" style="width:${w}px;height:${Math.round(H * s)}px"><div class="slide-scale" style="transform:scale(${s});transform-origin:0 0;width:${W}px;height:${H}px">${slideHTML(buildSpec(it))}</div></div>`; }

/* ---- 구성 아이템 (섹션 번호/페이지 번호) ---- */
function includedSecs(){ return S.sections.filter(s => s.include !== false); }
function secNoOf(sec){ const i = includedSecs().indexOf(sec); return i < 0 ? 0 : i + 1; }
function pageItem(sec, pg, no){ const sn = secNoOf(sec); return {kind: 'page', page: pg, sec, secNo: sn, secTitle: sec.title, label: `${sn ? two(sn) + '  ' : ''}${sec.title}`, no}; }
function sectionItems(sec){ return sec.pageList.map((p, i) => pageItem(sec, p, i + 1)); }
function assemble(){
  const out = [], m = S.merge;
  if (m.cover) out.push({kind: 'cover'});
  if (m.guide) out.push({kind: 'guide'});
  if (m.toc) out.push({kind: 'toc', secs: includedSecs().map(s => ({no: secNoOf(s), title: s.title, goal: s.goal}))});
  includedSecs().forEach(sec => sec.pageList.forEach(p => out.push(pageItem(sec, p, 0))));
  if (m.closing) out.push({kind: 'closing'});
  out.forEach((it, i) => { if (it.kind === 'page') it.no = i + 1; });
  return out;
}

const b64 = buf => { let s = '', b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
function readDataURL(file){ return new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(file); }); }
function imgSize(src){ return new Promise(r => { const i = new Image(); i.onload = () => r([i.naturalWidth, i.naturalHeight]); i.onerror = () => r([0, 0]); i.src = src; }); }
async function resizeImage(src, max = 1000, type = 'image/jpeg'){
  const [w, h] = await imgSize(src); if (!w) return {data: src, w: 0, h: 0};
  const s = Math.min(1, max / Math.max(w, h)), cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  const ctx = cv.getContext('2d'); if (type === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }
  const im = new Image(); im.src = src; await new Promise(r => { im.onload = r; if (im.complete) r(); });
  ctx.drawImage(im, 0, 0, cv.width, cv.height); return {data: cv.toDataURL(type, .88), w: cv.width, h: cv.height};
}
async function pptxText(buf){
  const zip = await JSZip.loadAsync(buf), num = n => +n.match(/(\d+)\.xml$/)[1];
  const slides = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  let out = '';
  for (const n of slides){
    const xml = new DOMParser().parseFromString(await zip.file(n).async('string'), 'application/xml');
    const paras = [...xml.getElementsByTagName('a:p')].map(p => [...p.getElementsByTagName('a:t')].map(t => t.textContent).join('')).filter(Boolean);
    out += `\n[슬라이드 ${num(n)}]\n` + paras.join('\n');
  }
  return {text: out.trim(), pages: slides.length};
}
async function extractFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'pdf'){
    const buf = await file.arrayBuffer();
    const keep = buf.byteLength < 9e6 ? b64(buf.slice(0)) : null;
    const pdf = await pdfjsLib.getDocument({data: buf}).promise; let out = '';
    for (let i = 1; i <= pdf.numPages; i++){ const p = await pdf.getPage(i); const tc = await p.getTextContent(); out += `\n[p.${i}]\n` + tc.items.map(t => t.str + (t.hasEOL ? '\n' : ' ')).join(''); }
    return {text: out.trim(), pages: pdf.numPages, pdfB64: keep};
  }
  if (ext === 'docx') return {text: (await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value};
  if (ext === 'pptx') return await pptxText(await file.arrayBuffer());
  if (['txt', 'md', 'csv', 'tsv', 'json'].includes(ext)) return {text: await file.text()};
  if (/^(png|jpe?g|webp|gif)$/.test(ext)){ const r = await resizeImage(await readDataURL(file), 1000); return {image: r.data, w: r.w, h: r.h, text: ''}; }
  if (ext === 'ppt' || ext === 'doc') throw new Error('구버전(.ppt/.doc)은 브라우저에서 읽을 수 없어요. PPTX/DOCX 또는 PDF로 저장 후 올려주세요');
  throw new Error('지원하지 않는 형식입니다');
}

/* 브랜드 이미지 → 대표 컬러 (AI 키 없을 때 사용) */
async function extractColors(srcs){
  const bins = {};
  for (const src of srcs){
    const im = new Image(); im.src = src; await new Promise(r => { im.onload = r; im.onerror = r; });
    const cv = document.createElement('canvas'); cv.width = cv.height = 64; const c = cv.getContext('2d'); c.drawImage(im, 0, 0, 64, 64);
    const d = c.getImageData(0, 0, 64, 64).data;
    for (let i = 0; i < d.length; i += 4){
      const [r, g, b] = [d[i], d[i + 1], d[i + 2]], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      if (mx - mn < 28 || mx < 30 || mn > 235) continue; // 무채색 제외
      const k = `${r >> 5},${g >> 5},${b >> 5}`; (bins[k] = bins[k] || {n: 0, r: 0, g: 0, b: 0}); bins[k].n++; bins[k].r += r; bins[k].g += g; bins[k].b += b;
    }
  }
  return Object.values(bins).sort((a, b) => b.n - a.n).map(v => rgbHex(v.r / v.n, v.g / v.n, v.b / v.n))
    .filter((h, i, arr) => arr.slice(0, i).every(o => { const A = hexRgb(o), B = hexRgb(h); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]) > 60; })).slice(0, 3);
}

async function callClaude({system, content, maxTokens = 8000, web = false}){

  if (!r.ok){
    const t = await r.text();
    if (web && r.status === 400 && /tool|web_search/i.test(t)) return callClaude({system, content, maxTokens, web: false});
    let m = t; try { m = JSON.parse(t).error.message; } catch(e){}
    throw new Error(`API ${r.status}: ${m}`);

}
function parseJSON(t){
  t = String(t).replace(/```json|```/g, '');
  const a = Math.min(...['{', '['].map(c => { const i = t.indexOf(c); return i < 0 ? 1e9 : i; }));
  const b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (a >= 1e9 || b < 0) throw new Error('AI 응답에서 JSON을 찾지 못했습니다');
  return JSON.parse(t.slice(a, b + 1));
}

  const find = (re, n = 3) => lines.filter(l => re.test(l)).slice(0, n).join(' / ');

  const base = [['KPI 달성 근거', 'RFP 목표 수치를 어떤 구조로 달성할지 보여주는 것이 평가 핵심'], ['매체 믹스·예산 효율', '예산 대비 성과 효율을 시나리오로 제시'], ['타겟·인사이트 차별화', '경쟁사와 다른 타겟 해석'], ['크리에이티브 테스트 체계', '소재 메시지 트랙과 테스트 설계'], ['운영·리포팅 안정성', '운영 인력·일정·리포트 체계']];
  const priorities = (evalLines.length >= 3 ? evalLines.map(l => [l.slice(0, 24), 'RFP 평가 항목에서 추출']) : base).map((p, i) => ({rank: i + 1, title: p[0], why: p[1], evidence: '규칙 기반 추출 — 확인 필요', angle: '', weight: i < 2 ? '상' : '중'}));
  const imgs = S.input.brand.filter(f => f.image).map(f => f.image);
  const cols = imgs.length ? await extractColors(imgs) : [];
  const res = {
    rfpSummary: {client: S.project.client, background: find(/배경|현황|개요/), objective: find(/목표|목적/), kpi: find(/KPI|ROAS|CPA|CPC|CTR|전환|매출|가입/i), budget: find(/예산|억|만\s*원|VAT/), period: find(/기간|개월|20\d\d\s*[.년]/), target: find(/타겟|고객|연령|여성|남성|MZ/), scope: find(/범위|과업|운영|제작|대행/), evaluation: evalLines.join(' / '), deadline: find(/제출|마감|PT|발표/), constraints: lines.filter(l => /필수|반드시|불가|제한/.test(l)).slice(0, 4)},
    priorities,
    colors: cols.length ? cols.map((h, i) => ({hex: h, role: ['Main','Sub','Accent'][i], name: '', reason: '브랜드 이미지에서 추출'})) : null,
    colorConcept: cols.length ? '브랜드 이미지 대표색 기반' : '',
    brandInsights: ['[AI 분석 시 자동 작성] 브랜드 자료·채널 기반 인사이트'],
    logic: {concept: '[제안 컨셉 입력]', message: '[핵심 메시지 입력]', storyline: [{title: '현황 진단', point: ''}, {title: '기회 정의', point: ''}, {title: '전략 방향', point: ''}, {title: '실행 계획', point: ''}, {title: '기대 성과', point: ''}]},
    sections: DEFAULT_SECTIONS, questions: []

  if (!res.colors) delete res.colors;
  applyAnalysis(res); save(); render(); toast('규칙 기반 초안 완료 — 내용을 직접 다듬어 주세요');
}

/* ---------- 2) 로직 / 섹션 생성 ---------- */

JSON만: {"pages":[{"type":"divider|bridge|strategy|explain","layout":"","title":"28자 내","subtitle":"헤드 메시지 45자 내","keyMsg":"하단 키 메시지 40자 내(없으면 빈값)","items":[{"h":"항목명 18자 내","d":"설명 70자 내","v":"수치(선택)"}],"notes":"발표자 노트 1~2문장"}]}

function fallbackPages(sec, N, useDiv){

async function genAll(){

/* ---------- 3) 디자인 워싱 ---------- */
function heuristicLayout(p){
  const it = itemsOf(p);
  if (p.type === 'divider' || p.type === 'bridge') return p.layout;
  if (p.layout === 'image') return 'image';
  if (it.length && it.filter(i => i.v).length >= Math.ceil(it.length / 2) && it.length <= 4) return 'kpi';
  if (it.some(i => /단계|STEP|Phase|주차|\d+\s*월|런칭|사전|준비/i.test(i.h))) return 'process';
  if (it.length >= 5) return 'table';
  if (p.type === 'strategy' && it.length >= 2 && it.length <= 4) return 'cards';
  if (p.keyMsg) return 'split';
  return it.length <= 4 && p.type === 'strategy' ? 'cards' : 'list';
}
async function washSections(idxs){
  const secs = idxs.map(i => S.sections[i]).filter(s => s && s.pageList.length);
  if (!secs.length){ toast('워싱할 페이지가 없습니다 — 로직 단계에서 내용을 먼저 작성하세요'); return; }
  busy('디자인 워싱 중…', '레이아웃 재구성 · 카피 다듬기 · 컬러칩 적용');
  let done = 0;
  await pool(secs, 3, async sec => {
    sec.pageList.forEach(p => { if (!p.washed) p.draft = clone({...p, draft: undefined}); });
    if (apiKey()){
      try {
        const res = parseJSON(await callClaude({system: SYS_BASE + '\n너는 동시에 제안서 아트디렉터다. 정보 위계를 정리하고 한 장 한 메시지 원칙으로 카피를 다듬는다.', maxTokens: 6000, content: `섹션 "${sec.title}"의 초안 페이지를 디자인 워싱해줘. 컬러칩: ${S.input.colors.map(c => c.role + ' ' + c.hex).join(', ')} (렌더러가 자동 적용).
초안: ${JSON.stringify(sec.pageList.map(p => ({id: p.id, type: p.type, layout: p.layout, title: p.title, subtitle: p.subtitle, keyMsg: p.keyMsg, items: itemsOf(p)})))}
각 페이지에 대해: 내용 의미·사실은 유지, 근거 없는 수치 추가 금지. 레이아웃은 정보 구조에 맞게 선택(strategy/explain만): cards(병렬 2~4개), process(순서·일정), kpi(수치 2~4개, v 필수), split(핵심 주장 + 근거), table(5개 이상 비교), list(기타), image는 유지.
타이틀은 명사형·간결(24자 내), subtitle은 결론형 헤드 메시지(40자 내), items h 14자 내 / d 60자 내로 압축, 필요 시 keyMsg 보강.
JSON만: {"pages":[{"id":"","layout":"","title":"","subtitle":"","keyMsg":"","items":[{"h":"","d":"","v":""}]}]}`}));
        (res.pages || []).forEach(r => { const p = sec.pageList.find(x => x.id === r.id); if (!p) return;
          if (p.type !== 'divider' && p.type !== 'bridge' && LAYOUTS[r.layout] && (p.layout !== 'image' || r.layout === 'image')) p.layout = r.layout;
          ['title', 'subtitle', 'keyMsg'].forEach(k => { if (typeof r[k] === 'string' && (r[k] || k === 'keyMsg')) p[k] = r[k]; });
          if (Array.isArray(r.items) && (r.items.length || p.type === 'divider')) p.items = r.items.map(i => ({h: i.h || '', d: i.d || '', v: i.v || ''}));
        });
      } catch(e){ console.error(e); toast(`"${sec.title}" AI 워싱 실패 → 규칙 기반 적용: ${e.message}`, 4000); sec.pageList.forEach(p => p.layout = heuristicLayout(p)); }
    } else sec.pageList.forEach(p => p.layout = heuristicLayout(p));
    sec.pageList.forEach(p => p.washed = true);
    busy('디자인 워싱 중…', `${++done} / ${secs.length} 섹션`);
  });
  unbusy(); save(); render(); toast('디자인 워싱 완료 — 컬러칩·Pretendard 위계 적용');
}
function unwash(p){ if (p.draft){ const d = p.draft; Object.assign(p, d); p.draft = null; } p.washed = false; }

/* ---------- 4) 점검 ---------- */
function allFields(){
  const out = [];
  S.sections.forEach((s, si) => s.pageList.forEach((p, pi) => {
    const ref = `${si}.${pi}`, lb = `${s.title} · p${pi + 1}`;
    ['title', 'subtitle', 'keyMsg'].forEach(f => p[f] && out.push({ref, label: lb, field: f, text: p[f]}));
    p.items.forEach((it, ii) => ['h', 'd', 'v'].forEach(f => it[f] && out.push({ref, label: lb, field: `items.${ii}.${f}`, text: it[f]})));
  }));
  return out;
}
const TYPO_RULES = [[/되요/g, '돼요'], [/됬/g, '됐'], [/몇일/g, '며칠'], [/금새/g, '금세'], [/왠만/g, '웬만'], [/역활/g, '역할'], [/할께/g, '할게'], [/않되/g, '안 되'], [/희안/g, '희한'], [/어떻해/g, '어떻게 해'], [/내노라/g, '내로라'], [/오랫만/g, '오랜만'], [/설겆이/g, '설거지'], [/일일히/g, '일일이'], [/곰곰히/g, '곰곰이'], [/깨끗히/g, '깨끗이'], [/  +/g, ' '], [/\.\.(?!\.)/g, '.'], [/ ,/g, ','], [/(\S{2,}) \1(?=\s|$)/g, '$1']];
async function typoCheck(){
  const F = allFields(); if (!F.length){ toast('점검할 내용이 없습니다'); return; }
  busy('오탈자 점검 중…');
  let issues = [];
  if (apiKey()){
    try {
      const list = F.map((f, i) => ({i, t: f.text}));
      const res = parseJSON(await callClaude({system: '너는 한국어 교정 전문가다. 맞춤법·띄어쓰기·오탈자·영문 철자·용어 불일치(같은 개념을 다른 표기로 쓴 경우)만 찾는다. 문체 취향 수정은 하지 않는다. JSON만 출력.', maxTokens: 6000, content: `다음 제안서 문구들을 점검해. JSON만: {"issues":[{"i":번호,"before":"원문 중 틀린 부분(정확히 일치하는 부분 문자열)","after":"수정안","reason":"사유"}]}\n${JSON.stringify(list)}`}));
      issues = (res.issues || []).filter(x => F[x.i] && F[x.i].text.includes(x.before) && x.before !== x.after).map(x => ({...F[x.i], before: x.before, after: x.after, reason: x.reason}));
    } catch(e){ toast('AI 점검 실패 → 규칙 기반 점검: ' + e.message, 4000); }
  }
  if (!apiKey() || !issues.length){
    F.forEach(f => TYPO_RULES.forEach(([re, to]) => { const m = f.text.match(re); if (m) m.forEach(b => { const a = b.replace(new RegExp(re.source), to); if (a !== b && !issues.some(x => x.ref === f.ref && x.field === f.field && x.before === b)) issues.push({...f, before: b, after: a, reason: '규칙 기반 맞춤법/공백'}); }); }));
  }
  S.checks.typos = issues.map(x => ({...x, id: uid()}));
  unbusy(); save(); render(); toast(`오탈자 ${issues.length}건 발견`);
}
function applyTypo(x){ const [si, pi] = x.ref.split('.').map(Number), p = S.sections[si]?.pageList[pi]; if (!p) return; const cur = getPath(p, x.field); if (typeof cur === 'string') setPath(p, x.field, cur.replace(x.before, x.after)); S.checks.typos = S.checks.typos.filter(t => t.id !== x.id); }

      S.checks.fit = {overall: '규칙 기반(키워드 매칭) 점검 결과입니다. 정밀 평가는 AI 키 설정 후 다시 실행하세요.', score: Math.round(items.reduce((a, b) => a + b.coverage, 0) / items.length), items, missing: []};

function openPreview(list, idx){
  let i = idx;
  const m = modal('미리보기', '<div class="pv"></div>');
  const draw = () => {
    const it = list[i], w = Math.min(1120, innerWidth - 110);
    $('.pv', m).innerHTML = `<div class="row mb12" style="justify-content:space-between"><div class="row"><button class="btn sm" data-nav="-1" ${i ? '' : 'disabled'}>◀ 이전</button><span class="tag">${i + 1} / ${list.length}</span><button class="btn sm" data-nav="1" ${i < list.length - 1 ? '' : 'disabled'}>다음 ▶</button></div><div class="row"><button class="btn sm" data-x="ppt">이 페이지 PPT</button><button class="btn sm" data-x="pdf">이 페이지 PDF</button></div></div>${thumbHTML(it, w)}`;
  };
  m.addEventListener('click', e => { const n = e.target.closest('[data-nav]'); if (n){ i = Math.max(0, Math.min(list.length - 1, i + +n.dataset.nav)); draw(); } const x = e.target.closest('[data-x]'); if (x) (x.dataset.x === 'ppt' ? exportPPTX : exportPDF)([list[i]], `page${two(i + 1)}`); });
  m.tabIndex = 0; m.focus(); m.addEventListener('keydown', e => { if (e.key === 'ArrowRight' && i < list.length - 1){ i++; draw(); } if (e.key === 'ArrowLeft' && i){ i--; draw(); } if (e.key === 'Escape') m.remove(); });
  draw();
}

async function setLogo(d){ const r = await resizeImage(d, 600, 'image/png'); S.template.logo = r.data; S.template.logoW = r.w; S.template.logoH = r.h; save(); }
async function templateMedia(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer()); const out = [];
  const used = new Set();
  for (const n of Object.keys(zip.files).filter(n => /^ppt\/(slideMasters|slideLayouts|slides)\/_rels\/.*\.rels$/.test(n))){ const x = await zip.file(n).async('string'); (x.match(/Target="\.\.\/media\/[^"]+"/g) || []).forEach(t => used.add(t.slice(18, -1))); }
  const files = Object.keys(zip.files).filter(n => /^ppt\/media\/.+\.(png|jpe?g|gif|svg)$/i.test(n));
  files.sort((a, b) => (used.has(b.split('/').pop()) - used.has(a.split('/').pop())));
  for (const n of files.slice(0, 40)){ const ext = n.split('.').pop().toLowerCase(); const mime = ext === 'svg' ? 'image/svg+xml' : ext === 'jpg' ? 'image/jpeg' : 'image/' + ext; out.push({name: n.split('/').pop(), data: `data:${mime};base64,` + await zip.file(n).async('base64')}); }
  return out;
}

  pagePPT: b => exportPPTX([pageItem(sec(b), pgOf(b), +b.dataset.p + 1)], `${sec(b).title}_p${+b.dataset.p + 1}`),
  pagePDF: b => exportPDF([pageItem(sec(b), pgOf(b), +b.dataset.p + 1)], `${sec(b).title}_p${+b.dataset.p + 1}`),
  addPage: b => { const t = b.dataset.t, s = sec(b); s.pageList.push(newPage(t, t === 'divider' ? {title: s.title, items: []} : {})); rr(); },
  pageMv: b => { mv(sec(b).pageList, +b.dataset.p, +b.dataset.d); rr(); },
  pageDup: b => { const p = clone(pgOf(b)); p.id = uid(); sec(b).pageList.splice(+b.dataset.p + 1, 0, p); rr(); },
  pageDel: b => { sec(b).pageList.splice(+b.dataset.p, 1); rr(); },
  itemAdd: b => { pgOf(b).items.push({h: '', d: '', v: ''}); rr(); },
  itemDel: b => { pgOf(b).items.splice(+b.dataset.i, 1); rr(); },
  imgDel: b => { const p = pgOf(b); p.image = null; if (p.layout === 'image') p.layout = 'list'; rr(); },
  preview: (b, e) => { e.preventDefault(); const s = sec(b); if (s) openPreview(sectionItems(s), +b.dataset.p); },
  previewFinal: b => openPreview(assemble(), +b.dataset.i),
  washAll: () => washSections(S.sections.map((s, i) => i)),
  washSec: b => washSections([+b.dataset.s]),
  unwashAll: () => { if (!confirm('모든 페이지를 워싱 전 초안으로 되돌릴까요?')) return; S.sections.forEach(s => s.pageList.forEach(unwash)); rr(); },
  unwashPage: b => { unwash(pgOf(b)); rr(); },
  typo: () => typoCheck(),
  typoOne: b => { const x = S.checks.typos.find(t => t.id === b.dataset.id); if (x) applyTypo(x); rr(); },
  typoSkip: b => { S.checks.typos = S.checks.typos.filter(t => t.id !== b.dataset.id); rr(); },
  typoAll: () => { [...S.checks.typos].forEach(applyTypo); rr(); toast('모두 적용했습니다'); },
  fit: () => fitCheck(),
  merge: () => { if (!includedSecs().some(s => s.pageList.length)){ toast('취합할 페이지가 없습니다'); return; } S.merge.done = true; rr(); toast(`제안서 취합 완료 — 총 ${assemble().length}장`); },
  finalPPT: () => exportPPTX(assemble(), 'final_proposal'),
  finalPDF: () => exportPDF(assemble(), 'final_proposal'),
  finalPrint: () => printPDF(assemble(), 'final_proposal'),
  saveJSON: () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${fname('project')}_${today().replace(/\./g, '')}.json`; a.click(); },
  loadJSON: () => $('#jsonIn').click(),
  newProject: () => { if (confirm('현재 작업을 지우고 새 프로젝트를 시작할까요? (먼저 [저장] 권장)')){ const t = S.template; S = defaultState(); S.template = t; rr(); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b, e); });

const thumbT = {};
document.addEventListener('input', e => {
  const el = e.target, p = el.dataset.bind; if (!p) return;
  if (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'number' || el.type === 'color') return; // change에서 처리
  setPath(S, p, el.value); save();
  if (/^input\.colors\.\d+\.hex$/.test(p) && validHex(el.value)){ const sw = el.closest('.chip')?.querySelector('.sw'); if (sw) sw.style.background = el.value; }
  const m = p.match(/^sections\.(\d+)\.pageList\.(\d+)\./);
  if (m){ const key = m[1] + '.' + m[2]; clearTimeout(thumbT[key]); thumbT[key] = setTimeout(() => { const t = $(`[data-thumb="${key}"]`), s = S.sections[+m[1]]; if (t && s) t.innerHTML = thumbHTML(pageItem(s, s.pageList[+m[2]], +m[2] + 1), 320); }, 250); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.file){ addFiles(el.dataset.file, [...el.files]); el.value = ''; return; }
  if (el.dataset.pimg){ const [si, pi] = el.dataset.pimg.split('.').map(Number), f = el.files[0]; if (!f) return; readDataURL(f).then(d => resizeImage(d, 1600)).then(r => { const p = S.sections[si].pageList[pi]; p.image = r.data; p.imageW = r.w; p.imageH = r.h; rr(); }); return; }
  const p = el.dataset.bind; if (!p) return;
  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(1, +el.value || 1) : el.value;
  if (el.type === 'color') v = v.toUpperCase();
  setPath(S, p, v);
  if (/\.type$/.test(p) && /pageList/.test(p)){ const pg = getPath(S, p.replace(/\.type$/, '')); if (v === 'strategy' && !['cards', 'process', 'kpi', 'split', 'image'].includes(pg.layout)) pg.layout = 'cards'; if (v === 'explain' && !['list', 'table', 'split', 'image'].includes(pg.layout)) pg.layout = 'list'; }
  save();
  if (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'number' || el.type === 'color' || /colors/.test(p)){ if (!el.closest('.modal') || /template|settings/.test(p)) render(); }
});
document.addEventListener('dragover', e => { const d = e.target.closest('.drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest('.drop')?.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('[data-drop]'); if (!d) return; e.preventDefault(); d.classList.remove('over'); addFiles(d.dataset.drop, [...e.dataTransfer.files]); });
$('#jsonIn').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const s = JSON.parse(await f.text()); if (!s.v) throw new Error('형식 오류'); S = Object.assign(defaultState(), s); rr(); toast('프로젝트를 불러왔습니다'); } catch(er){ toast('불러오기 실패: ' + er.message); } e.target.value = ''; });

render();
fontsReady().then(() => render());
</script>
</body>
</html>
