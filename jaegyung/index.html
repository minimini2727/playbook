<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재경관리사 검색 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16181d;--sub:#5b6270;--line:#e3e6eb;
  --accent:#2b59c3;--accent-soft:#e8eefb;--ok:#1f8a4c;--ok-soft:#e5f5ec;--bad:#c23b3b;--bad-soft:#fbeaea;
  --fa:#2b59c3;--tx:#b5651d;--co:#7a3fb5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--card:#1a1d23;--ink:#eceef2;--sub:#9aa1ad;--line:#2a2e36;
  --accent:#7ea2ff;--accent-soft:#1f2a44;--ok:#4cc884;--ok-soft:#163323;--bad:#ff7b7b;--bad-soft:#3a1c1c;
  --fa:#7ea2ff;--tx:#f0a65a;--co:#c18cf5}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
header p{margin:0;color:var(--sub);font-size:14px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.box{display:flex;gap:8px}
.box input{flex:1;min-width:0;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.box input:focus{border-color:var(--accent)}
.box button{font:inherit;font-weight:600;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ex{font-size:13px;color:var(--sub);margin-top:8px}
.ex a{color:var(--accent);cursor:pointer;text-decoration:none;margin-right:10px;white-space:nowrap}
.meta{font-size:13px;color:var(--sub);margin:8px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
.card>summary::-webkit-details-marker{display:none}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-fa{color:var(--fa);background:color-mix(in srgb,var(--fa) 14%,transparent)}
.t-tx{color:var(--tx);background:color-mix(in srgb,var(--tx) 14%,transparent)}
.t-co{color:var(--co);background:color-mix(in srgb,var(--co) 14%,transparent)}
.ttl{font-weight:700;font-size:16px;flex:1}
.arrow{color:var(--sub);transition:transform .2s}
details[open]>summary .arrow{transform:rotate(90deg)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.body h3{font-size:14px;margin:16px 0 6px;color:var(--accent);letter-spacing:.02em}
.body ul{margin:0;padding-left:18px}
.body li{margin:4px 0}
.desc li{margin:3px 0}
.q{background:var(--bg);border-radius:10px;padding:12px 14px}
.q .stem{font-weight:600;margin-bottom:8px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;padding:9px 12px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.exp{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14.5px;white-space:pre-line}
.rel{font-size:13px;color:var(--sub);margin-top:14px}
.rel a{color:var(--accent);cursor:pointer;margin-right:10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub)}
.note{font-size:12.5px;color:var(--sub);margin-top:28px;line-height:1.7}
b.k{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>재경관리사 검색 노트</h1>
  <p>키워드나 문장으로 물어보면 해설 · 기출 포인트 · 예시 문제를 보여줍니다.</p>
</header>

<div class="search">
  <div class="box">
    <input id="q" type="search" placeholder="예) 감가상각 시부인 / 손익분기점 어떻게 구해?" autocomplete="off">
    <button id="go">검색</button>
  </div>
  <div class="chips" id="subj">
    <button class="chip on" data-s="">전체</button>
    <button class="chip" data-s="재무회계">재무회계</button>
    <button class="chip" data-s="세무회계">세무회계</button>
    <button class="chip" data-s="원가관리회계">원가관리회계</button>
    <button class="chip" id="rand">🎲 랜덤 문제</button>
  </div>
  <div class="ex" id="ex"></div>
</div>

<div class="meta" id="meta"></div>
<div id="out"></div>

<div class="note">
  · 시험 구성: 재무회계·세무회계·원가관리회계 3과목, 과목당 40문항(4지선다), 150분 동시 시행, 과목별 70점 이상 합격 (삼일회계법인 PwC 공지 기준).<br>
  · 세법 수치는 2026년 귀속 기준으로 정리했습니다. 회차별 출제 기준 법령이 다를 수 있으니 응시 회차 공고를 꼭 확인하세요.<br>
  · 예시 문제는 기출 유형을 참고해 새로 만든 연습 문제입니다(실제 기출 원문 아님).
</div>
</div>

<script>
const S={fa:"재무회계",tx:"세무회계",co:"원가관리회계"};
const DB=[
/* ===================== 재무회계 ===================== */
{s:"fa",t:"재무보고 개념체계 · 질적특성",k:["개념체계","질적특성","목적적합성","표현충실성","충실한표현","비교가능성","검증가능성","적시성","이해가능성","근본적질적특성","보강적질적특성","중요성","예측가치","확인가치"],
d:["유용한 재무정보의 질적특성은 근본적 질적특성과 보강적 질적특성으로 나뉜다.","근본적 질적특성은 목적적합성(예측가치·확인가치·중요성)과 표현충실성(완전성·중립성·오류없음)이다.","보강적 질적특성은 비교가능성·검증가능성·적시성·이해가능성이다.","보강적 특성은 근본적 특성을 갖춘 정보의 유용성을 높일 뿐, 단독으로 정보를 유용하게 만들지 못한다.","중요성은 기업 특유의 목적적합성 측면이라 획일적 계량 임계치를 정할 수 없다."],
p:["근본적 vs 보강적 질적특성 구분 문제가 가장 자주 나온다.","'일관성'은 비교가능성과 관련되지만 비교가능성 자체와 같지 않다.","표현충실성의 구성요소(완전·중립·오류없음)를 묻는 보기 함정.","재무제표 요소: 자산·부채·자본·수익·비용."],
q:{stem:"다음 중 보강적 질적특성에 해당하지 않는 것은?",o:["비교가능성","검증가능성","적시성","표현충실성"],a:3,e:"표현충실성은 목적적합성과 함께 근본적 질적특성이다.\n보강적 질적특성은 비교가능성·검증가능성·적시성·이해가능성 4가지다."}},

{s:"fa",t:"재무제표 표시 (K-IFRS 1001)",k:["재무제표","재무제표표시","전체재무제표","상계","계속기업","유동","비유동","포괄손익계산서","기타포괄손익","영업이익","재무상태표","주석"],
d:["전체 재무제표는 재무상태표, 포괄손익계산서, 자본변동표, 현금흐름표, 주석으로 구성된다.","경영진은 계속기업 전제로 재무제표를 작성하며, 청산 의도 등이 있으면 다른 기준을 쓰고 공시한다.","자산과 부채, 수익과 비용은 기준서가 요구·허용하지 않는 한 상계하지 않는다.","재무상태표는 유동/비유동 구분법이 원칙이며, 유동성 순서 배열이 더 목적적합하면 허용된다.","비용은 성격별 또는 기능별로 분류하며, 기능별 분류 시 성격별 정보를 주석으로 공시한다."],
p:["'자산·부채 원칙적 상계' 같은 틀린 보기 고르기.","현금흐름 정보 외에는 발생기준으로 작성.","기타포괄손익 중 후속적으로 당기손익 재분류되는 항목 vs 재분류되지 않는 항목 구분.","재분류 X: 재평가잉여금, 확정급여 재측정요소, FVOCI 지분상품 평가손익."],
q:{stem:"재무제표 표시에 관한 설명으로 옳지 않은 것은?",o:["전체 재무제표에는 주석이 포함된다.","자산과 부채는 원칙적으로 상계하여 순액으로 표시한다.","재무제표는 일반적으로 계속기업을 전제로 작성한다.","비용을 기능별로 분류하면 성격별 정보를 추가 공시한다."],a:1,e:"기준서에서 요구하거나 허용하지 않는 한 자산과 부채는 상계하지 않는다."}},

{s:"fa",t:"현금및현금성자산",k:["현금","현금성자산","현금및현금성자산","당좌차월","우표","수입인지","선일자수표","타인발행수표","정기예금","3개월"],
d:["통화, 타인발행수표·송금수표·우편환 등 통화대용증권, 요구불예금은 현금이다.","현금성자산은 큰 거래비용 없이 현금 전환이 쉽고 가치변동 위험이 경미하며, 취득일로부터 만기가 3개월 이내인 금융상품이다.","우표·수입인지는 선급비용(소모품), 선일자수표는 매출채권, 당좌차월은 단기차입금(부채)이다.","만기 판단 기준은 결산일이 아니라 '취득일'이다."],
p:["취득 시 만기 3개월 이내 vs 결산일 기준 3개월 이내 함정.","선일자수표·우표·차용증서를 현금으로 넣는 오답.","당좌차월은 현금에서 차감하지 않고 부채로 표시."],
q:{stem:"다음 자료로 현금및현금성자산을 구하면?\n통화 100 / 타인발행수표 50 / 우표 10\n취득 시 만기 2개월 정기예금 200\n결산일 기준 만기 2개월(취득 시 만기 6개월) 정기예금 300",o:["350","360","650","150"],a:0,e:"현금 100 + 타인발행수표 50 + 취득 시 만기 3개월 이내 정기예금 200 = 350.\n우표는 현금이 아니고, 취득 시 만기 6개월 예금은 단기금융상품이다."}},

{s:"fa",t:"재고자산 · 원가흐름 가정 · 저가법",k:["재고자산","선입선출","선입선출법","후입선출","가중평균","이동평균","총평균","원가흐름","저가법","순실현가능가치","재고자산평가손실","감모손실","매출원가","fifo"],
d:["K-IFRS는 개별법, 선입선출법, 가중평균법을 인정하며 후입선출법은 허용하지 않는다.","물가 상승 시 기말재고·이익 크기: 선입선출 > 이동평균 ≥ 총평균, 매출원가는 반대.","재고자산은 원가와 순실현가능가치 중 낮은 금액으로 측정(저가법)하며 항목별 적용이 원칙이다.","원재료는 완제품이 원가 이상으로 팔릴 것으로 예상되면 감액하지 않는다.","평가손실은 매출원가에 가산, 이후 회복 시 최초 장부금액 한도로 환입한다."],
p:["물가상승 시 방법별 이익·기말재고 크기 비교.","FIFO는 실지재고조사법·계속기록법 결과가 같다.","원재료 저가법 예외 조항.","감모손실(수량) → 평가손실(단가) 순서로 계산."],
q:{stem:"기초재고 100개(@10), 당기매입 200개(@13), 당기판매 250개일 때 선입선출법 매출원가는?",o:["2,950","3,000","3,250","650"],a:0,e:"먼저 들어온 100개×10 = 1,000\n다음 150개×13 = 1,950\n매출원가 = 2,950 (기말재고 50개×13 = 650)\n※ 총평균법이면 단가 12 → 매출원가 3,000"}},

{s:"fa",t:"유형자산 취득원가",k:["유형자산","취득원가","취득세","설치비","시운전","복구원가","자산교환","상업적실질","일괄구입","정부보조금"],
d:["취득원가 = 구입가격(관세·환급불가 세금 포함, 할인 차감) + 경영진 의도대로 가동하는 데 직접 관련된 원가.","포함: 설치·조립비, 운송비, 전문가 수수료, 정상 작동 여부 시운전 원가, 복구원가 현재가치.","제외: 광고·판촉비, 새 시설 개설원가, 재배치·재편성 원가, 관리 및 일반간접원가.","교환: 상업적 실질이 있으면 제공자산 공정가치(처분손익 인식), 없으면 제공자산 장부금액.","정부보조금은 자산 차감 또는 이연수익 방식 모두 가능."],
p:["포함/제외 항목 골라 취득원가 계산하는 문제가 단골.","상업적 실질 유무에 따른 교환 회계처리.","토지와 건물 일괄 취득 후 건물 철거비는 토지원가."],
q:{stem:"기계장치 관련 지출: 매입가 1,000 / 취득세 50 / 설치비 30 / 시운전비 20 / 재배치비용 40 / 개업 광고비 10\n기계장치 취득원가는?",o:["1,100","1,140","1,150","1,060"],a:0,e:"1,000 + 50 + 30 + 20 = 1,100\n재배치비용과 광고비는 취득원가에 포함하지 않는다."}},

{s:"fa",t:"감가상각",k:["감가상각","정액법","정률법","연수합계법","생산량비례법","잔존가치","내용연수","이중체감법","상각방법변경"],
d:["정액법: (취득원가 − 잔존가치) ÷ 내용연수.","연수합계법: (취득원가 − 잔존가치) × 잔여내용연수 ÷ 내용연수 합계.","정률법·이중체감법: 기초 장부금액 × 상각률 (잔존가치 차감 X).","감가상각은 사용 가능한 때부터 시작한다.","잔존가치·내용연수·상각방법은 매 회계연도 말 재검토하며, 변경은 회계추정의 변경(전진법)이다."],
p:["1차연도 상각비가 가장 큰 방법: 정률법/이중체감법 > 연수합계법 > 정액법.","기중 취득 시 월할 계산.","상각방법 변경 = 추정의 변경 → 전진적 처리."],
q:{stem:"취득원가 1,000,000, 잔존가치 100,000, 내용연수 5년인 자산을 연수합계법으로 상각할 때 1차연도 감가상각비는?",o:["180,000","200,000","300,000","333,333"],a:2,e:"상각대상액 900,000 × 5/15 = 300,000\n(내용연수 합계 1+2+3+4+5 = 15)"}},

{s:"fa",t:"재평가모형",k:["재평가","재평가모형","재평가잉여금","원가모형","재평가손실","기타포괄손익"],
d:["유형자산은 원가모형과 재평가모형 중 선택해 분류 전체에 동일하게 적용한다.","재평가로 장부금액 증가 → 기타포괄손익(재평가잉여금). 단, 과거 당기손실 인식분은 그만큼 당기이익.","재평가로 감소 → 당기손실. 단, 재평가잉여금 잔액이 있으면 먼저 잉여금을 줄인다.","재평가잉여금은 당기손익으로 재분류하지 않고, 사용 또는 처분 시 이익잉여금으로 직접 대체할 수 있다."],
p:["증가 → 감소 / 감소 → 증가 순서별 처리 계산.","재평가잉여금의 이익잉여금 대체는 '선택'이며 당기손익 경유 X.","특정 자산만 골라 재평가 불가(분류 단위)."],
q:{stem:"20X1년 말 토지(장부 1,000)를 1,200으로 재평가했고, 20X2년 말 900으로 재평가했다. 20X2년 당기손익 영향은?",o:["당기손실 300","당기손실 100","기타포괄손실 300, 당기손익 영향 없음","영향 없음"],a:1,e:"20X1: 재평가잉여금 200 인식\n20X2: 감소 300 중 잉여금 200 먼저 상계, 나머지 100은 당기손실"}},

{s:"fa",t:"자산손상",k:["손상","손상차손","회수가능액","사용가치","순공정가치","처분부대원가","손상차손환입","현금창출단위"],
d:["회수가능액 = max(순공정가치, 사용가치). 순공정가치는 공정가치에서 처분부대원가를 뺀 금액.","장부금액 > 회수가능액이면 차액을 손상차손으로 인식한다.","원가모형 자산의 손상차손 환입은 손상이 없었다면 계상됐을 장부금액을 한도로 한다.","영업권 손상차손은 환입하지 않는다."],
p:["회수가능액은 '큰 금액'이라는 점.","환입 한도(손상 전 상각 후 장부금액).","영업권·비한정 무형자산은 매년 손상검사."],
q:{stem:"장부금액 500, 순공정가치 350, 사용가치 400인 기계장치의 손상차손은?",o:["150","100","50","0"],a:1,e:"회수가능액 = max(350, 400) = 400\n손상차손 = 500 − 400 = 100"}},

{s:"fa",t:"무형자산 · 연구개발비",k:["무형자산","연구단계","개발단계","개발비","연구비","영업권","내부창출","비한정","내용연수","경상개발비"],
d:["무형자산 인식요건: 식별가능성, 통제, 미래경제적효익.","연구단계 지출은 전액 발생 시 비용.","개발단계 지출은 기술적 실현가능성 등 6가지 요건을 모두 충족하면 무형자산(개발비), 아니면 비용.","연구·개발 단계 구분이 어려우면 모두 연구단계로 본다.","내부적으로 창출한 영업권, 브랜드, 고객목록 등은 무형자산으로 인식하지 않는다.","내용연수가 비한정이면 상각하지 않고 매년 손상검사한다."],
p:["구분 불가 시 연구단계로 간주 → 비용.","내부창출 영업권 인식 불가.","무형자산 잔존가치는 원칙적으로 0.","상각 방법 결정 불가 시 정액법."],
q:{stem:"무형자산에 관한 설명으로 옳은 것은?",o:["연구단계 지출도 요건을 갖추면 자산으로 인식한다.","내부적으로 창출한 영업권은 무형자산으로 인식할 수 없다.","내용연수가 비한정인 무형자산도 정액법으로 상각한다.","연구와 개발 단계 구분이 어려우면 개발단계로 본다."],a:1,e:"① 연구단계는 항상 비용 ③ 비한정은 상각 X, 손상검사 ④ 구분 불가 시 연구단계로 본다."}},

{s:"fa",t:"투자부동산",k:["투자부동산","공정가치모형","임대목적","시세차익","자가사용부동산","계정대체"],
d:["임대수익이나 시세차익 목적으로 보유하는 부동산이다.","자가사용 부동산, 판매 목적 부동산(재고자산), 건설 중인 자가사용 부동산은 제외.","원가모형 또는 공정가치모형 선택. 공정가치모형은 감가상각하지 않고 공정가치 변동을 당기손익으로 인식한다.","공정가치모형 투자부동산 → 자가사용 대체 시 대체 시점 공정가치가 원가가 된다."],
p:["유형자산 재평가모형(OCI)과 투자부동산 공정가치모형(당기손익) 비교.","미래 용도 미결정 토지는 투자부동산.","리스로 다른 회사에 제공하는 건물은 투자부동산."],
q:{stem:"공정가치모형을 적용하는 투자부동산의 공정가치 변동 처리로 옳은 것은?",o:["기타포괄손익","당기손익","이익잉여금 직접 조정","처리하지 않음"],a:1,e:"투자부동산 공정가치모형의 평가손익은 당기손익이며 감가상각하지 않는다."}},

{s:"fa",t:"금융자산 분류 (AC · FVOCI · FVPL)",k:["금융자산","상각후원가","fvoci","fvpl","기타포괄손익공정가치","당기손익공정가치","사업모형","원리금","지분상품","채무상품","재분류","기대신용손실"],
d:["채무상품은 사업모형과 계약상 현금흐름 특성(원리금만 지급)으로 분류한다.","원리금 수취 목적 → 상각후원가(AC), 수취+매도 목적 → FVOCI, 그 외 → FVPL.","지분상품은 원칙 FVPL, 단기매매가 아니면 최초 인식 시 FVOCI로 취소불가 선택 가능.","FVOCI 지분상품 평가손익은 처분 시에도 당기손익으로 재분류하지 않는다(이익잉여금 대체 가능).","FVOCI 채무상품 누적평가손익은 처분 시 당기손익으로 재분류한다.","손상(기대신용손실)은 AC·FVOCI 채무상품에만 적용한다."],
p:["지분 FVOCI vs 채무 FVOCI 재분류 여부 차이.","FVPL 거래원가는 당기비용, 그 외는 취득원가 가산.","사업모형 변경 시에만 채무상품 재분류 가능, 지분상품은 재분류 불가."],
q:{stem:"FVOCI로 지정한 지분상품을 처분할 때 누적 기타포괄손익의 처리는?",o:["당기손익으로 재분류한다.","당기손익으로 재분류하지 않는다.","손상차손으로 처리한다.","처분손익과 상계해 영업외손익으로 처리한다."],a:1,e:"FVOCI 지분상품의 평가손익은 재분류(recycling)하지 않는다. 채무상품과 구분해서 외워야 한다."}},

{s:"fa",t:"사채 · 유효이자율법",k:["사채","유효이자율","할인발행","할증발행","사채할인발행차금","표시이자","액면이자","상각후원가","이자비용","사채상환"],
d:["발행가액 = 미래 현금흐름(액면+표시이자)을 시장이자율로 할인한 현재가치.","시장이자율 > 표시이자율 → 할인발행, < → 할증발행.","이자비용 = 기초 장부금액 × 유효이자율, 상각액 = 이자비용 − 표시이자.","할인발행: 장부금액·이자비용이 매년 증가. 할증발행: 매년 감소.","사채 총 이자비용 = 표시이자 합계 + 할인액(− 할증액)."],
p:["할인/할증별 이자비용·장부금액 증감 방향 문제.","상환손익 = 상환 시 장부금액 − 상환금액.","발행비는 발행가액에서 차감 → 유효이자율 상승."],
q:{stem:"액면 1,000,000, 표시이자율 8%(연말 지급), 3년 만기, 유효이자율 10%로 950,263에 발행한 사채의 1차연도 이자비용은?",o:["80,000","95,026","100,000","15,026"],a:1,e:"이자비용 = 950,263 × 10% = 95,026\n할인차금 상각액 = 95,026 − 80,000 = 15,026"}},

{s:"fa",t:"충당부채 · 우발부채",k:["충당부채","우발부채","우발자산","제품보증","복구충당부채","미래영업손실","구조조정","손실부담계약"],
d:["충당부채 인식요건: 과거사건의 결과로 현재의무 존재, 자원 유출 가능성 높음, 금액 신뢰성 있게 추정 가능.","우발부채는 인식하지 않고 주석 공시(유출 가능성이 아주 낮으면 공시도 생략).","우발자산은 인식하지 않고, 유입 가능성이 높으면 주석 공시.","미래 영업손실은 충당부채로 인식하지 않는다.","손실부담계약은 현재의무로 보고 충당부채로 인식한다.","화폐의 시간가치 효과가 중요하면 현재가치로 측정한다."],
p:["미래영업손실 → 인식 X 보기 함정.","예상되는 자산처분이익은 충당부채 측정 시 고려하지 않는다.","제3자 변제는 확실한 경우에만 별도 자산(충당부채와 상계 X)."],
q:{stem:"다음 중 충당부채로 인식할 수 없는 것은?",o:["제품 판매에 따른 보증의무","법적 의무인 토양 복구원가","미래에 예상되는 영업손실","손실부담계약"],a:2,e:"미래 영업손실은 현재의무가 아니므로 충당부채로 인식하지 않는다."}},

{s:"fa",t:"리스 (K-IFRS 1116)",k:["리스","사용권자산","리스부채","리스이용자","리스제공자","금융리스","운용리스","단기리스","소액자산"],
d:["리스이용자는 리스 분류 없이 모든 리스에 사용권자산과 리스부채를 인식한다(단일모형).","예외: 단기리스(12개월 이하), 소액 기초자산 리스는 인식 면제 선택 가능.","리스부채 = 지급되지 않은 리스료를 내재이자율(산정 불가 시 증분차입이자율)로 할인한 현재가치.","사용권자산 = 리스부채 + 선급리스료 − 리스 인센티브 + 리스개설직접원가 + 복구원가 추정치.","리스제공자는 금융리스와 운용리스로 분류한다."],
p:["이용자는 분류 X, 제공자만 금융/운용 분류.","사용권자산 최초 원가 구성요소 계산.","소유권 이전 확실하면 기초자산 내용연수, 아니면 리스기간과 내용연수 중 짧은 기간 상각."],
q:{stem:"리스에 관한 설명으로 옳지 않은 것은?",o:["리스이용자는 원칙적으로 사용권자산과 리스부채를 인식한다.","리스이용자는 모든 리스를 금융리스와 운용리스로 분류한다.","단기리스는 인식 면제를 선택할 수 있다.","리스제공자는 리스를 금융리스와 운용리스로 분류한다."],a:1,e:"금융/운용리스 분류는 리스제공자만 한다. 이용자는 단일 모형."}},

{s:"fa",t:"수익인식 5단계 (K-IFRS 1115)",k:["수익","수익인식","5단계","수행의무","거래가격","계약식별","변동대가","본인","대리인","고객충성제도","반품권","할부판매"],
d:["1단계 계약 식별 → 2단계 수행의무 식별 → 3단계 거래가격 산정 → 4단계 거래가격 배분 → 5단계 수행의무 이행 시 수익 인식.","거래가격에는 변동대가, 유의적 금융요소, 비현금대가, 고객에게 지급할 대가를 고려한다.","거래가격은 개별 판매가격 비율로 수행의무에 배분한다.","수행의무는 한 시점 또는 기간에 걸쳐 이행된다.","대리인이면 순액(수수료)만 수익으로 인식한다."],
p:["5단계 순서 맞추기.","반품권 판매: 반품 예상분은 환불부채, 반품제품회수권 인식.","위탁판매는 수탁자가 제3자에게 판매한 시점에 수익.","상품권은 회수(재화 인도) 시점에 수익."],
q:{stem:"고객과의 계약에서 생기는 수익의 인식 단계 순서로 옳은 것은?",o:["계약 식별 → 거래가격 산정 → 수행의무 식별 → 배분 → 수익 인식","계약 식별 → 수행의무 식별 → 거래가격 산정 → 배분 → 수익 인식","수행의무 식별 → 계약 식별 → 배분 → 거래가격 산정 → 수익 인식","거래가격 산정 → 계약 식별 → 수행의무 식별 → 배분 → 수익 인식"],a:1,e:"계약 → 수행의무 → 거래가격 → 배분 → 이행 시 인식."}},

{s:"fa",t:"건설계약 · 진행기준",k:["건설계약","진행기준","진행률","공사수익","공사원가","미청구공사","초과청구공사","계약손실","기간에걸쳐"],
d:["진행률 = 누적 발생원가 ÷ 총 추정원가 (원가기준).","당기 수익 = 계약금액 × 누적 진행률 − 전기까지 인식한 수익.","총 손실이 예상되면 예상손실 전액을 즉시 비용으로 인식한다.","누적 수익 > 누적 청구액이면 미청구공사(자산), 반대면 초과청구공사(부채)."],
p:["연도별 계약이익 계산이 매회 출제 수준.","2차연도 추정원가 변경 시 누적법으로 계산.","손실 예상 시 당기 손실 = 총 예상손실 + 이미 인식한 이익."],
q:{stem:"계약금액 10,000, 총 추정원가 8,000, 1차연도 발생원가 2,000일 때 1차연도 계약이익은?",o:["2,000","500","2,500","0"],a:1,e:"진행률 = 2,000 ÷ 8,000 = 25%\n수익 = 10,000 × 25% = 2,500\n이익 = 2,500 − 2,000 = 500"}},

{s:"fa",t:"종업원급여 · 확정급여제도",k:["종업원급여","확정급여","확정기여","퇴직급여","재측정요소","보험수리적손익","사외적립자산","순확정급여부채","과거근무원가"],
d:["확정기여제도(DC): 납부할 기여금을 비용 인식, 추가 의무 없음.","확정급여제도(DB): 확정급여채무 현재가치 − 사외적립자산 공정가치 = 순확정급여부채(자산).","당기손익: 당기근무원가, 과거근무원가, 순이자.","기타포괄손익: 재측정요소(보험수리적손익, 사외적립자산 수익 중 이자 외 부분) → 후속 재분류 X."],
p:["재측정요소 = OCI, 재분류 금지.","과거근무원가는 발생 즉시 당기손익.","DC는 보험수리적 위험을 종업원이 부담."],
q:{stem:"확정급여제도에서 보험수리적손익의 처리로 옳은 것은?",o:["당기손익","기타포괄손익(후속 재분류 X)","기타포괄손익(후속 재분류 O)","이익잉여금 직접 조정만 가능"],a:1,e:"재측정요소는 기타포괄손익으로 인식하며 이후 당기손익으로 재분류하지 않는다."}},

{s:"fa",t:"자본 · 자기주식 · 배당",k:["자본","자기주식","주식배당","무상증자","주식분할","자본잉여금","이익잉여금","자기주식처분이익","감자","현금배당","유상증자"],
d:["자기주식 취득은 자본에서 차감(자본조정)하며 자산이 아니다.","자기주식처분이익은 자본잉여금, 처분손실은 처분이익과 상계 후 자본조정.","주식배당·무상증자·주식분할은 자본총계가 변하지 않는다.","현금배당은 선언 시 미지급배당금(부채) → 자본 감소.","유상증자는 자본 증가, 자기주식 취득은 자본 감소."],
p:["자본총계 증감 거래 고르기.","주식분할: 액면 감소, 자본금 불변. 주식배당: 자본금 증가, 이익잉여금 감소.","자기주식 소각 시 감자차손익."],
q:{stem:"다음 중 자본총계에 영향을 주지 않는 거래는?",o:["현금배당 선언","주식배당","유상증자","자기주식 취득"],a:1,e:"주식배당은 이익잉여금이 자본금으로 바뀔 뿐 자본총계는 그대로다."}},

{s:"fa",t:"주당이익 (EPS)",k:["주당이익","eps","기본주당이익","희석주당이익","가중평균유통보통주식수","우선주배당","잠재적보통주"],
d:["기본주당이익 = (보통주 귀속 당기순이익) ÷ 가중평균유통보통주식수.","보통주 귀속 이익 = 당기순이익 − 우선주배당금.","자기주식은 유통주식수에서 제외, 유상증자는 납입일부터 가중.","무상증자·주식배당·주식분할은 기초에 실시한 것으로 소급 조정.","희석주당이익은 전환사채·신주인수권 등 잠재적 보통주의 희석효과를 반영."],
p:["가중평균유통주식수 월할 계산.","무상증자의 소급 조정(원구주 기준).","반희석 잠재적 보통주는 제외."],
q:{stem:"당기순이익 1,000,000, 우선주배당금 100,000, 가중평균유통보통주식수 9,000주일 때 기본주당이익은?",o:["111원","100원","90원","120원"],a:1,e:"(1,000,000 − 100,000) ÷ 9,000 = 100원"}},

{s:"fa",t:"법인세회계 · 이연법인세",k:["법인세회계","이연법인세","이연법인세자산","이연법인세부채","일시적차이","가산할일시적차이","차감할일시적차이","영구적차이","법인세비용"],
d:["가산할 일시적차이 → 이연법인세부채, 차감할 일시적차이 → 이연법인세자산.","이연법인세자산은 미래 과세소득 발생 가능성이 높을 때만 인식한다.","측정은 차이 소멸 예상 기간의 세율을 적용하고, 현재가치로 할인하지 않는다.","법인세비용 = 당기법인세 ± 이연법인세 변동.","재무상태표에서 비유동으로만 분류한다."],
p:["현재가치 할인 금지.","영구적 차이(기업업무추진비 한도초과 등)는 이연법인세 X.","세율 변경 시 미래 적용 세율로 측정."],
q:{stem:"이연법인세에 관한 설명으로 옳지 않은 것은?",o:["가산할 일시적차이는 이연법인세부채를 발생시킨다.","이연법인세자산은 실현 가능성을 검토한다.","이연법인세는 현재가치로 할인하여 측정한다.","미래 소멸 시점의 예상 세율을 적용한다."],a:2,e:"이연법인세자산·부채는 현재가치로 할인하지 않는다."}},

{s:"fa",t:"회계변경 · 오류수정",k:["회계변경","회계정책변경","회계추정변경","오류수정","소급법","전진법","소급적용","전기오류"],
d:["회계정책 변경(재고자산 원가흐름 가정 변경 등) → 소급적용.","회계추정 변경(내용연수·잔존가치·상각방법·대손추정 등) → 전진적용.","정책 변경인지 추정 변경인지 구분이 어려우면 추정 변경으로 본다.","중요한 전기오류 → 소급재작성."],
p:["감가상각방법 변경 = 추정변경(전진법).","재고자산 평가방법 변경 = 정책변경(소급법).","유형자산 원가모형 → 재평가모형 최초 적용은 예외적으로 소급 X."],
q:{stem:"정액법에서 정률법으로 감가상각방법을 변경한 경우의 처리로 옳은 것은?",o:["회계정책 변경, 소급적용","회계추정 변경, 전진적용","오류수정, 소급재작성","회계처리하지 않음"],a:1,e:"감가상각방법 변경은 회계추정의 변경이므로 전진법을 적용한다."}},

{s:"fa",t:"현금흐름표 · 간접법",k:["현금흐름표","간접법","직접법","영업활동","투자활동","재무활동","영업활동현금흐름","이자지급","배당금지급"],
d:["간접법: 당기순이익 ± 현금 유출입 없는 손익 ± 영업 관련 자산·부채 변동.","감가상각비 가산, 유형자산처분이익 차감.","영업 자산 증가는 차감, 감소는 가산. 영업 부채 증가는 가산, 감소는 차감.","이자·배당 수취·지급은 영업 또는 투자/재무 중 선택해 일관 적용."],
p:["간접법 영업활동현금흐름 계산 문제가 매회.","이자지급·배당금지급 분류 선택 가능.","법인세는 원칙적으로 영업활동."],
q:{stem:"당기순이익 500, 감가상각비 100, 매출채권 증가 50, 매입채무 증가 30, 재고자산 감소 20일 때 영업활동현금흐름은?",o:["600","500","540","660"],a:0,e:"500 + 100 − 50 + 30 + 20 = 600"}},

{s:"fa",t:"관계기업 · 지분법",k:["지분법","관계기업","유의적인영향력","20%","공동기업","지분법이익","지분법손실"],
d:["의결권 20% 이상이면 유의적 영향력이 있는 것으로 본다(반증 가능).","최초 원가로 인식 후 피투자자 순이익 중 투자자 지분만큼 장부금액 증가.","피투자자로부터 받은 배당금은 투자자산 장부금액을 감소시킨다(수익 X).","투자차액 중 영업권 해당분은 별도 상각하지 않는다."],
p:["지분법 장부금액 계산: 취득원가 + 지분법이익 − 배당.","20% 미만이어도 이사회 참여 등이면 유의적 영향력.","배당금을 수익으로 처리하는 오답 보기."],
q:{stem:"관계기업 지분 30%를 1,000에 취득했다. 당기 피투자회사 순이익 500, 배당금 지급 100일 때 기말 투자주식 장부금액은?",o:["1,150","1,120","1,000","1,030"],a:1,e:"1,000 + 500×30% − 100×30% = 1,120"}},

{s:"fa",t:"복합금융상품 · 전환사채",k:["전환사채","전환권","전환권대가","복합금융상품","신주인수권부사채","상환할증금"],
d:["전환사채는 부채요소와 자본요소(전환권)로 분리한다.","부채요소 = 미래 현금흐름을 전환권 없는 일반사채 시장이자율로 할인한 현재가치.","자본요소(전환권대가) = 발행가액 − 부채요소 공정가치(잔여접근법).","상환할증금은 부채요소 현금흐름에 포함한다."],
p:["전환권대가 계산(잔여법).","이자비용 = 부채 장부금액 × 일반사채 유효이자율.","전환 시 손익 인식 없음."],
q:{stem:"전환사채를 1,000,000에 발행했고, 부채요소의 현재가치가 920,000이다. 전환권대가(자본)는?",o:["920,000","80,000","1,000,000","0"],a:1,e:"1,000,000 − 920,000 = 80,000 (자본요소)"}},

{s:"tx",t:"납세의무 성립 · 확정",k:["납세의무","성립","확정","성립시기","신고납세","부과과세","자동확정","국세기본법"],
d:["소득세·법인세·부가가치세: 과세기간이 끝나는 때 성립(수입재화 부가세는 수입신고 시).","상속세: 상속 개시 시. 증여세: 증여재산 취득 시.","원천징수 소득세·법인세: 소득금액 지급 시. 인지세: 과세문서 작성 시.","확정: 신고납세(소득·법인·부가)는 신고 시, 부과과세(상속·증여)는 정부 결정 시.","자동확정: 인지세, 원천징수세, 중간예납 법인세, 납부지연가산세 등."],
p:["세목별 성립시기 잘못 연결된 보기 고르기.","중간예납 법인세는 자동확정.","상속·증여세는 신고해도 정부 결정으로 확정."],
q:{stem:"국세의 납세의무 성립시기로 옳지 않은 것은?",o:["법인세: 과세기간이 끝나는 때","상속세: 상속이 개시되는 때","원천징수하는 소득세: 소득금액을 지급하는 때","증여세: 증여계약을 체결하는 때"],a:3,e:"증여세는 증여에 의해 재산을 취득하는 때 성립한다."}},

{s:"tx",t:"부과제척기간 · 소멸시효",k:["부과제척기간","제척기간","소멸시효","무신고","사기","부정행위","경정청구"],
d:["일반 국세 부과제척기간: 5년.","무신고 7년, 사기 등 부정행위 10년.","상속세·증여세: 10년(무신고·부정행위·허위신고 등은 15년).","국세징수권 소멸시효: 5억원 이상 10년, 5억원 미만 5년.","경정청구: 법정신고기한 지난 후 5년 이내."],

{s:"tx",t:"세무조정 · 소득처분",k:["세무조정","소득처분","익금산입","손금불산입","손금산입","익금불산입","유보","상여","배당","기타사외유출","기타","대표자상여"],

{s:"tx",t:"법인세율 · 산출세액 (2026년 귀속)",k:["법인세율","산출세액","과세표준","법인세","세율","누진세율","법인세계산"],

p:["누진구간별 산출세액 계산.","사업연도 1년 미만 환산 계산.","응시 회차의 출제 기준 세율 확인 필수."],
q:{stem:"2026.1.1 개시 사업연도(12개월) 일반법인의 과세표준이 3억원일 때 산출세액은?",o:["4,000만원","3,800만원","5,700만원","6,000만원"],a:0,e:"2억 × 10% = 2,000만원\n1억 × 20% = 2,000만원\n합계 4,000만원\n(2025년 세율이면 1,800만 + 1,900만 = 3,700만원)"}},

{s:"tx",t:"기업업무추진비(접대비) 한도",k:["기업업무추진비","접대비","접대비한도","적격증빙","경조사비","수입금액","기본한도"],

p:["기본한도 + 수입금액 한도 계산 문제가 단골.","적격증빙 미수취 금액부터 먼저 부인.","현물 접대 시 시가와 장부가 중 큰 금액."],
q:{stem:"중소기업이 아닌 법인(사업연도 12개월)의 일반 수입금액이 50억원일 때 기업업무추진비 한도액은? (추가한도는 없다고 가정)",o:["1,200만원","1,500만원","2,700만원","5,100만원"],a:2,e:"기본한도 1,200만원 + 50억 × 0.3% = 1,500만원\n합계 2,700만원"}},

{s:"tx",t:"감가상각비 시부인",k:["감가상각비","시부인","상각부인액","시인부족액","상각범위액","즉시상각의제","신고내용연수","결산조정"],

p:["시인부족액은 이월되지 않는다.","상각부인액은 이후 시인부족액 범위에서 추인.","소액자산(거래단위 100만원 이하) 즉시상각 특례."],
q:{stem:"당기 회사계상 감가상각비 500만원, 세법상 상각범위액 400만원, 전기이월 상각부인액 없음. 세무조정은?",o:["손금불산입 100만원(유보)","손금산입 100만원(△유보)","손금불산입 100만원(기타사외유출)","세무조정 없음"],a:0,e:"회사계상 > 상각범위액 → 차액 100만원은 상각부인액으로 손금불산입, 유보."}},

{s:"tx",t:"대손금 · 대손충당금",k:["대손금","대손충당금","대손실적률","한도초과","채권잔액","대손사유","1%"],

p:["한도 계산과 대손실적률 산정.","신고조정 대손사유(소멸시효 완성 등) vs 결산조정 대손사유(부도 6개월 경과 등).","전기 한도초과액 손금산입(△유보) 조정."],
q:{stem:"세무상 채권잔액 10억원, 대손실적률 1.5%, 회사의 기말 대손충당금 설정액 2,000만원. 세무조정은?",o:["손금불산입 500만원(유보)","손금불산입 1,000만원(유보)","손금산입 500만원(△유보)","세무조정 없음"],a:0,e:"한도 = 10억 × max(1%, 1.5%) = 1,500만원\n한도초과 = 2,000만 − 1,500만 = 500만원 손금불산입(유보)"}},

{s:"tx",t:"지급이자 손금불산입",k:["지급이자","지급이자손금불산입","채권자불분명","비실명","건설자금이자","업무무관자산","가지급금"],

q:{stem:"지급이자 손금불산입 적용 순서상 가장 먼저 적용하는 것은?",o:["건설자금이자","업무무관자산 관련 이자","채권자 불분명 사채이자","비실명 채권 이자"],a:2,e:"채권자 불분명 사채이자 → 비실명 이자 → 건설자금이자 → 업무무관자산 이자 순."}},

{s:"tx",t:"부당행위계산 부인",k:["부당행위계산","부당행위계산부인","특수관계인","시가","5%","3억","저가양도","고가매입","가지급금인정이자"],

p:["5% 또는 3억원 기준 판정.","특수관계인 판단은 쌍방관계 기준.","상장주식 시가는 거래일 종가."],
q:{stem:"법인이 대표이사에게 시가 10억원 토지를 9억 8천만원에 양도했다. 부당행위계산 부인 여부는?",o:["적용: 차액 2천만원 익금산입","미적용: 차이가 시가의 5% 미만이고 3억원 미만","적용: 차액 2천만원 손금산입","미적용: 특수관계인 거래가 아님"],a:1,e:"차이 2천만원은 시가의 2%로 5% 미만, 3억원 미만이므로 현저한 이익 요건 미충족 → 부인 대상 아님."}},

{s:"tx",t:"이월결손금 공제",k:["이월결손금","결손금","공제한도","15년","80%","결손금소급공제"],

q:{stem:"비중소기업의 당기 각 사업연도 소득이 10억원, 공제 가능한 이월결손금이 12억원이면 당기 공제액은?",o:["12억원","10억원","8억원","공제 불가"],a:2,e:"공제 한도 = 10억 × 80% = 8억원. 남은 4억원은 다음 연도로 이월."}},

{s:"tx",t:"금융소득 종합과세",k:["금융소득","이자소득","배당소득","종합과세","분리과세","2000만원","2천만원","gross-up","배당가산"],

q:{stem:"거주자의 이자소득 1,200만원, 배당소득 600만원(모두 국내 원천, 원천징수됨)뿐일 때 과세방법은?",o:["전액 종합과세","원천징수로 분리과세 종결","배당소득만 종합과세","이자소득만 종합과세"],a:1,e:"금융소득 합계 1,800만원 ≤ 2,000만원 → 분리과세로 종결."}},

{s:"tx",t:"근로소득 · 비과세",k:["근로소득","비과세","식대","식사대","자가운전보조금","출산수당","보육수당","야간근로수당","연말정산","근로소득공제"],

p:["비과세 한도 숫자(월 20만원) 문제.","현물식사와 식대를 동시에 받으면 식대는 과세.","일용근로자는 분리과세(원천징수 종결)."],

{s:"tx",t:"종합소득세율 · 산출세액",k:["종합소득세","소득세율","종합소득","누진공제","소득세산출세액","과세표준"],

{s:"tx",t:"부가가치세 · 영세율 vs 면세",k:["영세율","면세","부가가치세","완전면세","부분면세","수출","매입세액환급","면세포기","미가공식료품"],

p:["영세율·면세 비교표 문제.","면세 대상 열거(미가공 식료품, 수돗물, 연탄, 의료·교육용역, 도서·신문 등).","면세포기 후 3년간 면세 재적용 불가."],
q:{stem:"영세율과 면세에 대한 설명으로 옳은 것은?",o:["면세사업자는 매입세액을 환급받을 수 있다.","영세율은 부분면세 제도이다.","영세율 적용 사업자는 부가가치세법상 사업자 의무가 있다.","면세는 수출을 촉진하기 위한 제도이다."],a:2,e:"영세율은 완전면세로 매입세액 환급 가능하며 사업자 의무가 있다. 면세는 부분면세로 매입세액 불공제."}},

{s:"tx",t:"부가가치세 과세표준",k:["부가가치세과세표준","공급가액","에누리","환입","매출할인","판매장려금","대손금","하자보증금","간주공급"],

{s:"co",t:"원가 개념 · 분류",k:["원가","원가분류","변동원가","고정원가","기회원가","매몰원가","관련원가","준변동원가","조업도","직접원가","간접원가","통제가능원가"],
d:["조업도 증가 시 총변동원가는 증가, 단위당 변동원가는 일정.","총고정원가는 일정, 단위당 고정원가는 감소.","매몰원가: 이미 발생해 회수 불가 → 의사결정과 무관.","기회원가: 포기한 대안 중 최대 이익 → 의사결정에 고려.","관련원가: 대안 간 차이가 나는 미래원가."],

{s:"co",t:"제조원가 흐름",k:["제조원가","당기총제조원가","당기제품제조원가","매출원가","재공품","기초재공품","기말재공품","제조원가명세서","가공원가","기본원가"],
d:["당기총제조원가 = 직접재료비 + 직접노무비 + 제조간접비.","당기제품제조원가 = 기초재공품 + 당기총제조원가 − 기말재공품.","매출원가 = 기초제품 + 당기제품제조원가 − 기말제품.","직접재료비 = 기초원재료 + 매입 − 기말원재료."],

q:{stem:"직접재료비 300, 직접노무비 200, 제조간접비 100, 기초재공품 50, 기말재공품 80, 기초제품 100, 기말제품 70일 때 매출원가는?",o:["570","600","630","530"],a:1,e:"총제조원가 600 → 제품제조원가 50 + 600 − 80 = 570\n매출원가 100 + 570 − 70 = 600"}},

{s:"co",t:"보조부문원가 배분",k:["보조부문","보조부문원가","직접배분법","단계배분법","상호배분법","이중배분율법","제조부문"],
d:["직접배분법: 보조부문 간 용역 수수를 무시하고 제조부문에만 배분.","단계배분법: 배분 순서를 정해 일부 보조부문 간 용역만 반영.","상호배분법: 보조부문 간 용역 수수를 모두 반영(연립방정식) → 가장 정확.","어떤 방법을 써도 공장 전체 제조간접비 총액은 같다.","이중배분율법: 변동비는 실제 사용량, 고정비는 최대 사용가능량 기준 배분."],

q:{stem:"보조부문원가 배분방법에 관한 설명으로 옳지 않은 것은?",o:["상호배분법은 보조부문 간 용역 수수를 모두 고려한다.","직접배분법은 보조부문 간 용역 수수를 무시한다.","단계배분법은 배분 순서에 따라 결과가 달라질 수 있다.","배분방법에 따라 공장 전체 제조간접비 총액이 달라진다."],a:3,e:"배분방법은 제조부문 간 배분 금액만 바꿀 뿐 회사 전체 제조간접비 총액은 동일하다."}},

{s:"co",t:"개별원가 · 제조간접비 예정배부",k:["개별원가계산","예정배부","예정배부율","배부차이","과대배부","과소배부","정상원가계산","제조간접비","작업원가표"],
d:["개별원가계산: 다품종 소량 주문생산(조선·건설 등), 작업별 원가 집계.","예정배부율 = 연간 제조간접비 예산 ÷ 연간 예정 조업도.","예정배부액 = 실제 조업도 × 예정배부율.","배부차이 = 실제 발생액 − 예정배부액. 실제 > 예정이면 과소배부(불리), 반대면 과대배부(유리).","배부차이 조정: 매출원가조정법, 비례배분법, 영업외손익법."],
p:["예정배부액과 배부차이 계산.","과소/과대배부 판단.","비례배분법은 기말재공품·제품·매출원가에 배분."],
q:{stem:"제조간접비 예산 1,000,000, 예정 직접노동시간 10,000시간. 실제 노동시간 9,000시간, 실제 제조간접비 950,000일 때 배부차이는?",o:["50,000 과소배부","50,000 과대배부","100,000 과소배부","배부차이 없음"],a:0,e:"예정배부율 100/시간 → 예정배부액 900,000\n실제 950,000 − 900,000 = 50,000 과소배부"}},

{s:"co",t:"종합원가 · 완성품환산량",k:["종합원가계산","완성품환산량","평균법","선입선출법","가공비","재료비","공손","정상공손","비정상공손","재공품"],
d:["종합원가계산: 동종 제품 대량생산, 공정별 원가 집계.","평균법 환산량 = 완성품 수량 + 기말재공품 환산량.","선입선출법 환산량 = 평균법 환산량 − 기초재공품 환산량.","재료를 공정 초에 투입하면 재공품의 재료 진행률은 100%.","정상공손원가는 합격품에 배분, 비정상공손원가는 영업외비용(기간비용)."],
p:["평균법 vs 선입선출법 환산량 차이 = 기초재공품 환산량.","기초재공품이 없으면 두 방법 결과 동일.","공손 검사시점 통과 여부로 정상공손 배분."],
q:{stem:"기초재공품 200개(가공 50%), 당기착수 1,000개, 완성 900개, 기말재공품 300개(가공 40%). 가공비는 균등 발생할 때 선입선출법 가공비 완성품환산량은?",o:["1,020개","920개","1,000개","900개"],a:1,e:"평균법: 900 + 300×40% = 1,020\n선입선출법: 1,020 − 200×50% = 920"}},

{s:"co",t:"결합원가 배분",k:["결합원가","결합제품","분리점","상대적판매가치법","순실현가치법","균등이익률법","부산물","추가가공"],
d:["결합원가는 분리점 이전 공통 발생 원가.","배분법: 물량기준법, 분리점 상대적 판매가치법, 순실현가치법(최종판매가 − 추가가공원가), 균등이익률법.","추가가공 의사결정: 추가수익 > 추가가공원가면 가공. 결합원가는 매몰원가라 무관.","부산물은 생산기준법 또는 판매기준법으로 처리."],
p:["순실현가치법 배분 계산.","추가가공 의사결정에서 결합원가 무관.","균등이익률법은 모든 제품의 매출총이익률이 같다."],
q:{stem:"결합제품의 추가가공 여부를 결정할 때 고려하지 않는 것은?",o:["추가가공 후 판매가격","분리점 판매가격","추가가공원가","분리점 이전 결합원가"],a:3,e:"결합원가는 이미 발생해 어떤 결정을 해도 변하지 않는 매몰원가다."}},

{s:"co",t:"표준원가 · 차이분석",k:["표준원가","차이분석","가격차이","수량차이","능률차이","임률차이","소비차이","조업도차이","유리한차이","불리한차이"],
d:["재료 가격차이 = (실제단가 − 표준단가) × 실제수량.","재료 수량차이 = (실제수량 − 표준수량) × 표준단가.","노무 임률차이 = (실제임률 − 표준임률) × 실제시간, 능률차이 = (실제시간 − 표준시간) × 표준임률.","고정제조간접비 조업도차이 = 예산 − 표준배부액(기준조업도와 실제산출 차이로 발생).","표준수량(SQ)은 '실제 산출량'에 허용된 표준수량이다."],
p:["SQ를 실제 산출량 기준으로 계산하는지 확인.","가격차이 분리 시점(구입 시점 vs 사용 시점).","고정제조간접비 조업도차이는 통제 불가능 차이로 해석."],
q:{stem:"제품 1개당 표준 재료 2kg, 표준단가 10원. 실제 생산 500개, 실제 사용 1,100kg(@9원). 재료 수량차이는?",o:["1,000원 불리","1,000원 유리","1,100원 유리","100원 불리"],a:0,e:"SQ = 500 × 2 = 1,000kg\n(1,100 − 1,000) × 10 = 1,000원 불리\n※ 가격차이: (9 − 10) × 1,100 = 1,100원 유리"}},

{s:"co",t:"변동원가계산 vs 전부원가계산",k:["변동원가계산","전부원가계산","초변동원가계산","공헌이익","고정제조간접비","재고","이익차이","직접원가계산"],
d:["전부원가: 고정제조간접비를 제품원가로 처리(재고에 포함).","변동원가: 고정제조간접비를 기간비용으로 처리.","이익 차이 = 기말재고 속 고정제조간접비 − 기초재고 속 고정제조간접비.","생산 > 판매(재고 증가) → 전부원가 이익이 더 크다. 생산 < 판매 → 변동원가 이익이 더 크다.","초변동원가계산: 직접재료비만 제품원가."],
p:["두 방법 이익 차이 계산.","변동원가계산은 외부보고용으로 인정되지 않는다.","전부원가는 생산량 늘려 이익 조작 가능(재고 과잉 유인)."],
q:{stem:"기초재고 없음, 생산 1,000개, 판매 800개, 단위당 고정제조간접비 50원. 두 방법의 영업이익 차이는?",o:["전부원가 이익이 10,000원 더 크다","변동원가 이익이 10,000원 더 크다","전부원가 이익이 50,000원 더 크다","차이 없다"],a:0,e:"기말재고 200개 × 50 = 10,000원이 전부원가에서는 자산으로 이연 → 전부원가 이익이 10,000원 크다."}},

{s:"co",t:"CVP 분석 · 손익분기점",k:["cvp","손익분기점","bep","공헌이익","공헌이익률","안전한계","영업레버리지","목표이익","레버리지도"],
d:["단위당 공헌이익 = 판매가격 − 단위당 변동비, 공헌이익률 = 공헌이익 ÷ 매출액.","손익분기점 판매량 = 고정비 ÷ 단위당 공헌이익, 손익분기점 매출액 = 고정비 ÷ 공헌이익률.","목표이익 판매량 = (고정비 + 목표이익) ÷ 단위당 공헌이익. 세후 목표이익이면 ÷ (1 − 세율)로 세전 환산.","안전한계 = 매출액 − BEP 매출액, 안전한계율 = 안전한계 ÷ 매출액.","영업레버리지도(DOL) = 공헌이익 ÷ 영업이익 = 1 ÷ 안전한계율."],
p:["BEP·목표이익 판매량 계산 매회 출제.","DOL × 매출 변화율 = 영업이익 변화율.","고정비 비중이 클수록 DOL이 크다."],
q:{stem:"단위당 판매가격 1,000원, 단위당 변동비 600원, 고정비 2,000,000원일 때 손익분기점 판매량은?",o:["2,000개","3,333개","5,000개","6,000개"],a:2,e:"단위당 공헌이익 400원\n2,000,000 ÷ 400 = 5,000개\n(목표이익 400,000원이면 6,000개)"}},

{s:"co",t:"활동기준원가계산 (ABC)",k:["활동기준원가","abc","원가동인","활동","원가집합","묶음수준","제품수준","설비수준","단위수준"],
d:["제조간접비를 활동별로 집계하고, 각 활동의 원가동인으로 제품에 배부한다.","활동 계층: 단위수준 → 묶음(배치)수준 → 제품유지수준 → 설비유지수준.","제품이 다양하고 제조간접비 비중이 클수록 유용하다.","전통적 방식보다 정확하지만 도입·운영비용이 크다."],
p:["활동 수준별 예시 연결(검사·작업준비 = 배치수준 등).","ABC가 유용한 상황 고르기.","설비유지활동은 원가동인 찾기 어려움."],
q:{stem:"활동기준원가계산이 특히 유용한 상황은?",o:["단일 제품을 대량 생산할 때","제조간접비 비중이 작을 때","제품 종류가 다양하고 제조간접비 비중이 클 때","직접노무비가 원가의 대부분일 때"],a:2,e:"제품 다양성이 크고 간접비 비중이 클수록 전통적 배부의 왜곡이 커져 ABC의 효익이 커진다."}},

{s:"co",t:"관련원가 의사결정 (특별주문 · 자가제조)",k:["특별주문","자가제조","외부구입","관련원가","유휴설비","증분수익","증분원가","제품라인폐지","의사결정","make or buy"],
d:["특별주문: 유휴설비가 있으면 증분수익 > 증분원가(변동원가)일 때 수락. 기존 고정비는 무관.","유휴설비가 없으면 기존 판매 포기분 공헌이익(기회원가)을 추가로 고려.","자가제조 vs 외부구입: 외부구입가 vs (회피가능 변동비 + 회피가능 고정비 − 설비 대체 활용 이익).","제품라인 폐지: 감소하는 공헌이익 vs 회피가능 고정비."],
p:["특별주문 최소 수락가격 계산.","회피불능 고정비는 무관원가.","설비 대체 사용 시 기회원가 포함."],
q:{stem:"정상 판매가 1,000원, 단위당 변동원가 600원, 단위당 고정원가 200원. 유휴설비가 충분할 때 특별주문의 최소 수락가격은?",o:["1,000원","800원","600원","200원"],a:2,e:"유휴설비가 있으면 고정원가는 무관 → 변동원가 600원 이상이면 이익이 증가한다."}},

{s:"co",t:"자본예산 (NPV · IRR · 회수기간)",k:["자본예산","순현재가치","npv","내부수익률","irr","회수기간","회계적이익률","arr","수익성지수","할인율"],
d:["NPV = 현금유입 현재가치 − 투자액. NPV > 0이면 채택.","IRR: NPV를 0으로 만드는 할인율. IRR > 자본비용이면 채택.","NPV법은 자본비용으로, IRR법은 IRR로 재투자한다고 가정 → 상충 시 NPV법 우선.","회수기간법: 화폐의 시간가치 무시(할인회수기간법은 반영), 회수 이후 현금흐름 무시.","회계적이익률법: 현금흐름 아닌 회계이익 사용, 시간가치 무시."],
p:["각 방법의 장단점 비교 문제.","NPV법 가치가산원칙 성립.","감가상각비는 현금유출 아님, 감세효과만 반영."],
q:{stem:"자본예산 기법에 관한 설명으로 옳지 않은 것은?",o:["NPV법은 가치가산의 원칙이 성립한다.","IRR법은 내부수익률로 재투자한다고 가정한다.","회수기간법은 화폐의 시간가치를 고려한다.","NPV법과 IRR법이 상충하면 NPV법을 따른다."],a:2,e:"일반 회수기간법은 화폐의 시간가치와 회수기간 이후 현금흐름을 무시한다."}},

{s:"co",t:"성과평가 (ROI · RI · EVA)",k:["투자수익률","roi","잔여이익","ri","경제적부가가치","eva","책임회계","투자중심점","이익중심점","준최적화","매출이익률","자산회전율"],
d:["ROI = 영업이익 ÷ 투자액 = 매출액이익률 × 자산회전율.","RI = 영업이익 − 투자액 × 최저필수수익률.","EVA = 세후영업이익 − 투하자본 × 가중평균자본비용.","ROI는 준최적화(전사에 유리한 투자를 부문이 거부) 문제가 있고, RI는 규모가 다른 부문 비교가 어렵다.","책임중심점: 원가·수익·이익·투자중심점."],
p:["ROI·RI 계산 및 투자안 수락 여부 판단.","ROI 분해(듀퐁).","RI가 준최적화 문제 완화."],
q:{stem:"투자액 1,000,000원, 영업이익 200,000원, 최저필수수익률 15%일 때 잔여이익(RI)은?",o:["50,000원","150,000원","200,000원","30,000원"],a:0,e:"200,000 − 1,000,000 × 15% = 50,000원 (ROI는 20%)"}},

{s:"co",t:"대체가격 (사내이전가격)",k:["대체가격","이전가격","사내대체","최소대체가격","최대대체가격","기회원가","공급부문","구매부문"],
d:["공급부문 최소대체가격 = 단위당 증분원가(변동원가) + 단위당 기회원가.","유휴설비가 있으면 기회원가 = 0 → 최소대체가격 = 변동원가.","유휴설비가 없으면 기회원가 = 외부판매 포기 공헌이익 → 최소대체가격 = 외부판매가(판매비 절감 시 차감).","구매부문 최대대체가격 = 외부 구입가격.","방법: 시장가격기준, 원가기준, 협상가격기준."],
p:["유휴설비 유무에 따른 최소대체가격.","목표일치성과 부문 자율성 고려.","내부 대체 시 절감되는 판매비 차감."],
q:{stem:"공급부문 단위당 변동원가 400원, 외부판매가 700원, 유휴설비 없음. 최소대체가격은? (판매비 절감 없음)",o:["400원","300원","700원","1,100원"],a:2,e:"변동원가 400 + 기회원가(포기 공헌이익 300) = 700원"}},

{s:"co",t:"종합예산",k:["종합예산","판매예산","생산예산","제조예산","현금예산","고정예산","변동예산","예산편성"],
d:["종합예산은 판매예산에서 출발한다.","생산량 = 판매량 + 기말제품 재고 − 기초제품 재고.","원재료 구입량 = 생산 소요량 + 기말원재료 − 기초원재료.","변동예산은 실제 조업도에 맞춘 예산으로 성과평가에 적합하다.","현금예산은 판매·구입 대금의 회수·지급 시기를 반영한다."],
p:["생산량·구입량 예산 계산.","고정예산 vs 변동예산 비교.","현금예산의 외상매출 회수 패턴 계산."],
q:{stem:"예산 판매량 1,000개, 기말제품 목표 200개, 기초제품 150개일 때 예산 생산량은?",o:["1,050개","950개","1,200개","1,350개"],a:0,e:"1,000 + 200 − 150 = 1,050개"}},

{s:"co",t:"균형성과표 (BSC) · 품질원가",k:["균형성과표","bsc","재무관점","고객관점","내부프로세스","학습과성장","품질원가","예방원가","평가원가","내부실패원가","외부실패원가","목표원가","수명주기원가"],
d:["BSC 4가지 관점: 재무, 고객, 내부 프로세스, 학습과 성장. 비재무지표를 함께 쓴다.","관점 간 인과관계: 학습·성장 → 내부 프로세스 → 고객 → 재무.","품질원가: 예방원가·평가원가(통제원가) + 내부실패원가·외부실패원가(실패원가).","예방·평가원가를 늘리면 실패원가가 줄어드는 상충관계.","목표원가 = 목표가격 − 목표이익(시장 중심 원가관리)."],
p:["BSC 관점 분류 문제(직원 교육 시간 = 학습과 성장).","품질원가 항목 분류(반품·보증수리 = 외부실패).","수명주기원가 대부분은 설계 단계에서 결정."],
q:{stem:"다음 중 외부실패원가에 해당하는 것은?",o:["품질 교육훈련비","원재료 수입검사비","공정 중 재작업 원가","판매 후 보증수리비"],a:3,e:"교육훈련 = 예방원가, 수입검사 = 평가원가, 재작업 = 내부실패원가, 보증수리 = 외부실패원가."}}
];

/* ---------- 검색 엔진 ---------- */
const JOSA=["으로부터","에서는","이랑은","으로는","에게서","이란게","이라는","이란","란게","에서","으로","에게","하고","이랑","까지","부터","처럼","보다","은","는","이","가","을","를","에","의","와","과","로","랑","도","만","요"];
const STOP=["뭐야","뭐지","뭔가요","무엇","무엇인가요","알려줘","알려주세요","설명","설명해줘","해줘","해주세요","대해","대해서","관련","관련된","어떻게","어떻게해","구해","구하는","구하나요","계산","계산법","방법","문제","기출","예시","하는","되나요","인가요","뭐","좀","그리고","정리","개념","공식","차이","차이가","차이점","궁금","궁금해","있어","있나요","무슨","어떤","왜","하나요","되는","되면","하면","처리","처리는"];
const norm=s=>s.toLowerCase().replace(/[?!.,·()\[\]"'“”~\/]/g," ").replace(/\s+/g," ").trim();
const ns=s=>norm(s).replace(/\s/g,"");
function stripJosa(w){for(const j of JOSA){if(w.length>j.length+1&&w.endsWith(j))return w.slice(0,-j.length)}return w}
function tokens(q){return norm(q).split(" ").map(stripJosa).filter(w=>w.length>=1&&!STOP.includes(w))}

DB.forEach((e,i)=>{e.id=i;e._k=e.k.map(ns);e._t=ns(e.t);e._d=ns(e.d.join(" ")+" "+e.p.join(" "))});

function score(e,q){
  const qs=ns(q),tk=tokens(q);let sc=0;
  e._k.forEach(k=>{if(k.length>=2&&qs.includes(k))sc+=8+k.length});
  if(qs.length>=2&&e._t.includes(qs))sc+=30;
  tk.forEach(w=>{
    if(w.length<2)return;
    if(e._t.includes(w))sc+=7;
    if(e._k.some(k=>k.includes(w)))sc+=5;
    else if(w.length>=3&&e._k.some(k=>w.includes(k)&&k.length>=2))sc+=3;
    if(e._d.includes(w))sc+=1.5;
  });
  return sc;
}

let subj="";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(text,q){
  let h=esc(text);const ws=tokens(q).filter(w=>w.length>=2).sort((a,b)=>b.length-a.length).slice(0,6);
  ws.forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");h=h.replace(re,m=>`<b class="k">${m}</b>`)});
  return h;
}
const TAGC={fa:"t-fa",tx:"t-tx",co:"t-co"};

function card(e,open,q){
  const d=document.createElement("details");d.className="card";if(open)d.open=true;
  const opts=e.q.o.map((o,i)=>`<button class="opt" data-i="${i}">${"①②③④"[i]} ${esc(o)}</button>`).join("");
  const rel=related(e).map(r=>`<a data-id="${r.id}">${esc(r.t)}</a>`).join("");
  d.innerHTML=`<summary><span class="tag ${TAGC[e.s]}">${S[e.s]}</span><span class="ttl">${esc(e.t)}</span><span class="arrow">›</span></summary>
  <div class="body">
    <h3>📘 해설</h3><ul class="desc">${e.d.map(x=>`<li>${hl(x,q||"")}</li>`).join("")}</ul>
    <h3>🎯 기출 포인트</h3><ul>${e.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>✍️ 예시 문제</h3>
    <div class="q"><div class="stem">${esc(e.q.stem)}</div>${opts}<div class="exp" hidden></div></div>
    ${rel?`<div class="rel">함께 보기: ${rel}</div>`:""}
  </div>`;
  d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,box=b.parentElement;
    box.querySelectorAll(".opt").forEach((x,j)=>{x.classList.remove("ok","bad");if(j===e.q.a)x.classList.add("ok")});
    if(i!==e.q.a)b.classList.add("bad");
    const ex=box.querySelector(".exp");ex.hidden=false;
    ex.textContent=(i===e.q.a?"✅ 정답입니다. ":"❌ 오답입니다. 정답은 "+"①②③④"[e.q.a]+"\n")+e.q.e;
  });
  d.querySelectorAll(".rel a").forEach(a=>a.onclick=()=>showOne(+a.dataset.id));
  return d;
}
function related(e){
  return DB.filter(x=>x!==e&&x.s===e.s).map(x=>({x,s:x.k.filter(k=>e.k.some(m=>m.includes(k)||k.includes(m))).length+(x.d.join("").includes(e.t.split(" ")[0])?1:0)}))
    .filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,3).map(o=>o.x);
}
function render(list,q,msg){
  const out=$("out");out.innerHTML="";$("meta").textContent=msg||"";
  if(!list.length){out.innerHTML=`<div class="empty">관련 항목을 찾지 못했어요.<br>더 짧은 키워드(예: 감가상각, 영세율, 손익분기점)로 다시 검색해 보세요.</div>`;return}
  list.forEach((e,i)=>out.appendChild(card(e,i===0,q)));
  window.scrollTo({top:0,behavior:"smooth"});
}
function search(){
  const q=$("q").value.trim();
  const pool=DB.filter(e=>!subj||S[e.s]===subj);
  if(!q){render(pool,"",`${subj||"전체"} ${pool.length}개 주제`);return}
  const r=pool.map(e=>({e,s:score(e,q)})).filter(o=>o.s>=4).sort((a,b)=>b.s-a.s);
  const top=r.length?r[0].s:0;
  const list=r.filter(o=>o.s>=top*0.35).slice(0,6).map(o=>o.e);
  render(list,q,list.length?`'${q}' 관련 ${list.length}개 · 가장 가까운 주제를 펼쳐 두었어요`:"");
}
function showOne(id){const e=DB[id];$("q").value=e.t;render([e,...related(e)],e.t,"선택한 주제와 함께 볼 주제")}

$("go").onclick=search;
$("q").addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();search()}});
document.querySelectorAll("#subj .chip[data-s]").forEach(c=>c.onclick=()=>{
  document.querySelectorAll("#subj .chip[data-s]").forEach(x=>x.classList.remove("on"));c.classList.add("on");subj=c.dataset.s;search();
});
$("rand").onclick=()=>{
  const pool=DB.filter(e=>!subj||S[e.s]===subj);const e=pool[Math.floor(Math.random()*pool.length)];
  $("q").value="";render([e],"","🎲 랜덤 주제 · 예시 문제부터 풀어보세요");
};
const EX=["감가상각 시부인","손익분기점 어떻게 구해?","영세율이랑 면세 차이","재고자산 선입선출","접대비 한도 계산","완성품환산량 평균법","법인세율 2026","재평가잉여금 처리"];
$("ex").innerHTML="예시: "+EX.map(x=>`<a>${x}</a>`).join("");
$("ex").querySelectorAll("a").forEach(a=>a.onclick=()=>{$("q").value=a.textContent;search()});
render(DB,"",`전체 ${DB.length}개 주제 · 키워드나 문장으로 검색하세요`);
</script>
</body>
</html>
